<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111311">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>LOGIKAPPS · Tu espacio personal</title>
  <link rel="icon" href="assets/logo-symbol.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="catalog.js" defer></script>
  <script src="discover-catalog.js" defer></script>
  <script src="state.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Ir a mis herramientas</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegación principal">
      <a class="brand" href="#apps" aria-label="LOGIKAPPS, ir a mis apps">
        <img src="assets/logo-symbol.svg" alt="" width="54" height="54">
        <span><strong>LOGIK<span>APPS</span></strong><small>Tu espacio personal</small></span>
      </a>
      <nav class="primary-nav" id="primary-nav"></nav>
      <div class="collection-nav"><p class="nav-heading">Colecciones</p><nav id="collection-nav" aria-label="Colecciones"></nav></div>
      <div class="sidebar-bottom"><div class="profile"><span class="avatar" aria-hidden="true">M</span><span>Mi espacio<small>Ideas en movimiento</small></span></div><button class="nav-item" data-view="settings" id="settings-link"></button></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="search-wrap"><span id="search-icon" aria-hidden="true"></span><input type="search" id="search" autocomplete="off" placeholder="Buscar una app o una idea…" aria-label="Buscar una app o una idea"><kbd aria-hidden="true">⌘ K</kbd></div>
        <button class="button button-primary" data-action="new-app" id="add-app-button"></button>
      </header>
      <div id="mode-notice" class="mode-notice" hidden></div>
      <div class="content-layout">
        <main id="main-content" tabindex="-1"><div class="loading-state"><span class="loading-dot"></span>Preparando tu espacio…</div></main>
        <aside id="ideas-rail" class="ideas-rail" aria-label="Próximas ideas"></aside>
      </div>
      <footer class="workspace-footer"><span><i class="connection-dot"></i><span id="environment-label">Tu espacio personal</span></span><span>LOGIKAPPS <span id="version-label"></span></span></footer>
    </div>
  </div>
  <dialog id="editor-dialog" class="editor-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
</body>
</html>
