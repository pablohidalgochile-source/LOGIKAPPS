name: Check and package macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Universal build and tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node for frontend tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check Bash 3.2 syntax
        shell: bash
        run: |
          for script in scripts/*.sh; do /bin/bash -n "$script"; done
      - name: Test frontend logic
        run: node --test tests/*.test.cjs
      - name: Package public Surco and FRATV tools
        run: |
          python3 scripts/package-surco.py
          python3 scripts/package-fratv.py
      - name: Build universal macOS application
        run: /bin/bash scripts/build-macos.sh
      - name: Test native storage and validation
        run: .build/LOGIKAPPS.app/Contents/MacOS/LOGIKAPPS --self-test
      - name: Check architecture, signature, metadata and public catalog
        run: /bin/bash scripts/check-package.sh
      - name: Create beta DMG
        run: /bin/bash scripts/create-dmg.sh
      - name: Upload beta package and verification files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LOGIKAPPS-beta-${{ matrix.runner }}
          path: |
            dist/LOGIKAPPS-0.3.0-macos-universal.dmg
            dist/LOGIKAPPS-0.3.0-macos-universal.dmg.sha256
            dist/LOGIKAPPS-0.3.0-macos-universal.dmg.metadata.json
            dist/Surco-0.1.0-beta.zip
            dist/Surco-0.1.0-beta.zip.sha256
            dist/FRATV-OBS-Pack-0.1.0-beta.zip
            dist/FRATV-OBS-Pack-0.1.0-beta.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          include-hidden-files: false
      # WKWebView UI checks need a logged-in macOS GUI session. They are a
      # separate local release check in docs/DISTRIBUCION.md, not a skipped pass.
