<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROGRAM · Salida limpia</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="mx-core.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#000;overflow:hidden;font-family:'Inter',system-ui,sans-serif;color:#fff;}
  #video{width:100vw;height:100vh;object-fit:contain;background:#000;display:block;}
  /* Overlay de arranque (no se captura en OBS: OBS entra ya con audio permitido) */
  .gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#000;z-index:10;}
  .gate.hide{display:none;}
  .gate h1{font-size:1.1rem;font-weight:900;letter-spacing:2px;}
  .gate p{color:#8b8892;font-size:.86rem;text-align:center;max-width:340px;line-height:1.5;}
  .gate input{background:#0d0d10;border:1px solid #26262b;color:#fff;padding:12px;border-radius:10px;font-size:1rem;text-align:center;letter-spacing:3px;text-transform:uppercase;font-family:ui-monospace,monospace;width:220px;}
  .gate button{background:#ff3040;border:0;color:#fff;font-weight:800;font-size:1rem;padding:13px 26px;border-radius:11px;cursor:pointer;font-family:inherit;}
  .hint{position:fixed;left:0;right:0;bottom:0;padding:10px;text-align:center;color:#5a5862;font-size:.72rem;z-index:5;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent);opacity:0;transition:opacity .2s;}
  body:hover .hint{opacity:1;}
  .audbtn{position:fixed;top:12px;right:12px;z-index:6;background:rgba(0,0,0,.5);border:1px solid #26262b;color:#fff;font-family:inherit;font-weight:700;font-size:.78rem;padding:8px 12px;border-radius:9px;cursor:pointer;opacity:0;transition:opacity .2s;}
  body:hover .audbtn{opacity:1;}
</style>
</head>
<body>
  <video id="video" autoplay playsinline></video>

  <div class="gate" id="gate">
    <h1>📺 SALIDA PROGRAM</h1>
    <p>Muestra la cámara EN AIRE, limpia y a pantalla completa, para capturar en OBS (Window/Browser source).</p>
    <input id="sala" placeholder="FRATE-000" maxlength="14" />
    <button onclick="entrar()">Conectar salida</button>
    <p style="font-size:.74rem;">En OBS agrega esta ventana como fuente. El audio va incluido; si OBS no lo toma, usa un dispositivo de audio virtual.</p>
  </div>

  <button class="audbtn" id="audbtn" onclick="toggleAud()" style="display:none;">🔇 Audio</button>
  <div class="hint">Salida limpia · sin señal cuando no hay cámara en aire</div>

<script>
  const { canal, ICE } = MX;
  const progId = 'prog-' + Math.random().toString(36).slice(2, 9);
  let pc = null, ch = null, sala = '';
  const $ = id => document.getElementById(id);
  const vid = $('video');
  vid.muted = true; // arranca mudo para poder autoplay; se activa con el botón/OBS

  try { const u = new URL(location.href); const s = (u.searchParams.get('sala') || '').toUpperCase(); if (s) { $('sala').value = s; entrar(); } } catch (e) {}

  function entrar(){
    sala = ($('sala').value || '').trim().toUpperCase();
    if (!sala) { $('sala').focus(); return; }
    $('gate').classList.add('hide');
    $('audbtn').style.display = '';
    ch = canal(sala);
    ch.on('broadcast', { event: 'sig' }, ({ payload }) => onSig(payload));
    ch.subscribe(s => { if (s === 'SUBSCRIBED') hello(); });
  }
  function hello(){ send({ t: 'hello-program', from: progId }); }
  function send(p){ if (ch) ch.send({ type: 'broadcast', event: 'sig', payload: p }); }

  async function onSig(p){
    if (!p) return;
    if (p.t === 'prog-offer' && p.to === progId) await handleOffer(p);
    else if (p.t === 'prog-ice' && p.to === progId && pc) { try { await pc.addIceCandidate(p.cand); } catch (e) {} }
  }
  async function handleOffer(p){
    if (pc) { try { pc.close(); } catch (e) {} }
    pc = new RTCPeerConnection(ICE);
    pc.ontrack = e => {
      // Preferimos el stream asociado; si viniera vacío, lo armamos con los tracks recibidos.
      vid.srcObject = e.streams[0] || new MediaStream(pc.getReceivers().map(r => r.track).filter(Boolean));
    };
    pc.onicecandidate = e => { if (e.candidate) send({ t: 'prog-ice', from: progId, to: 'estudio', cand: e.candidate }); };
    pc.onconnectionstatechange = () => { if (['failed','disconnected','closed'].includes(pc.connectionState)) setTimeout(hello, 1500); };
    try {
      await pc.setRemoteDescription(p.sdp);
      const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
      send({ t: 'prog-answer', from: progId, to: 'estudio', sdp: ans });
    } catch (e) { console.warn('prog offer', e); }
  }
  function toggleAud(){ vid.muted = !vid.muted; $('audbtn').innerHTML = vid.muted ? '🔇 Audio' : '🔊 Audio'; if (!vid.muted) vid.play().catch(()=>{}); }
</script>
</body>
</html>
