                  <div style={{ fontSize: 11, color: "#ff3aa8", fontFamily: "'JetBrains Mono', monospace", letterSpacing: 1.5, marginBottom: 8, textTransform: "uppercase" }}>Guía de recuperación</div>
                  <div style={{ fontSize: 12.5, color: "#cfd1d9", lineHeight: 1.65 }}>
                    1. Exporta este snapshot como <b style={{color:"#f4f5f8"}}>JSON</b> y guárdalo en un lugar seguro.<br/>
                    2. Si Serato pierde crates: abre este snapshot y revisa la estructura.<br/>
                    3. Recrea manualmente los crates o reimporta el ZIP de Serato desde <b style={{color:"#f4f5f8"}}>Settings</b>.<br/>
                    4. Corre el scanner local para validar que los archivos físicos siguen accesibles.
                  </div>
                  <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                    <Btn size="sm" variant="fucsia" icon="download" onClick={() => doExportJSON(selSnap)}>Exportar para recuperar</Btn>
                    <Btn size="sm" variant="ghost" icon="book" onClick={() => doExportCSV(selSnap)}>Exportar CSV</Btn>
                  </div>
                </div>
              </div>
            </Card>
          )}
        </div>
      )}

      {/* Info cards */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 16, marginTop: 20 }}>
        {[
          { ic: "check", c: "#22e1ff", t: "¿Qué se guarda?", s: "Estructura de grupos y crates, conteos de tracks, extensiones y muestra de 300 tracks. No guarda archivos de audio." },
          { ic: "bolt",  c: "#ffb84d", t: "¿Cuándo guardar?", s: "Antes de reorganizar crates, antes de actualizar Serato, antes de una sesión importante o después del scanner." },
          { ic: "history",c:"#c084fc", t: "¿Dónde se almacena?", s: "En localStorage del navegador. Para mayor seguridad usa 'Exportar JSON' y guarda el archivo externamente." },
        ].map(it => (
          <Card key={it.t} padding={20}>
            <div style={{ display: "flex", gap: 12, alignItems: "flex-start" }}>
              <div style={{ width: 36, height: 36, borderRadius: 10, background: `${it.c}1a`, border: `1px solid ${it.c}40`, display: "grid", placeItems: "center", color: it.c, flexShrink: 0 }}>
                <NKIcon name={it.ic} size={16} />
              </div>
              <div>
                <div style={{ fontSize: 14, color: "#f4f5f8", fontWeight: 500, marginBottom: 4 }}>{it.t}</div>
                <div style={{ fontSize: 12.5, color: "#8b8fa3", lineHeight: 1.5 }}>{it.s}</div>
              </div>
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

Object.assign(window, { ScreenRestore });

</script>

<!-- Pantalla 12: Identificar Set DJ (Shazam-style) -->
<script type="text/babel" data-presets="env,react">
// NANOOKEY — Pantalla 12: Identificar Set (Shazam-style)
// Analiza video/audio de un set DJ y extrae el tracklist con timestamps
// Usa AudD API (https://audd.io) — consulta condiciones vigentes del proveedor

const { useState: useStateSI, useRef: useRefSI, useEffect: useEffectSI } = React;

// ── Constantes ───────────────────────────────────────────────
const AUDD_ENDPOINT   = "https://api.audd.io/";
const CHUNK_DURATION  = 20;   // segundos a enviar por chunk
const CHUNK_INTERVAL  = 45;   // cada cuántos segundos muestrear

const MOCK_RESULTS = [
  { ts:"0:00",  title:"Ojitos Lindos",       artist:"Bad Bunny & Bomba Estéreo", confidence:98, found:true  },
  { ts:"0:45",  title:"Provenza",            artist:"Karol G",                   confidence:95, found:true  },
  { ts:"1:30",  title:"Tití Me Preguntó",    artist:"Bad Bunny",                 confidence:97, found:false },
  { ts:"2:15",  title:"Despechá",            artist:"Rosalía",                   confidence:91, found:true  },
  { ts:"3:00",  title:"Efecto",              artist:"Bad Bunny",                 confidence:96, found:false },
  { ts:"3:45",  title:"Gatúbela",            artist:"Karol G & Maldy",           confidence:89, found:true  },
  { ts:"4:30",  title:"Zorra (Intro Clean)", artist:"Bad Gyal",                  confidence:93, found:true  },
  { ts:"5:15",  title:"Aprovechalo",         artist:"Jowell & Randy",            confidence:98, found:true  },
  { ts:"6:00",  title:"La Romana",           artist:"Ozuna x Bad Bunny",         confidence:87, found:true  },
  { ts:"6:45",  title:"Calm Down",           artist:"Rema",                      confidence:92, found:false },
  { ts:"7:30",  title:"Gasolina",            artist:"Daddy Yankee",              confidence:99, found:true  },
  { ts:"8:15",  title:"In Time",             artist:"DROELOE ft. Belle Doron",   confidence:85, found:true  },
];

// ── WAV encoder (AudioBuffer → Blob) ─────────────────────────
function audioBufferToWav(buffer) {
  const numCh  = buffer.numberOfChannels;
  const len    = buffer.length * numCh * 2 + 44;
  const out    = new ArrayBuffer(len);
  const view   = new DataView(out);
  let pos = 0;
  const setU16 = v => { view.setUint16(pos, v, true); pos += 2; };
  const setU32 = v => { view.setUint32(pos, v, true); pos += 4; };
  const setI32 = v => { view.setInt32(pos,  v, true); pos += 4; };

  setU32(0x46464952); setI32(len - 8);  setU32(0x45564157);
  setU32(0x20746d66); setI32(16);       setU16(1);
  setU16(numCh);      setU32(buffer.sampleRate);
  setU32(buffer.sampleRate * numCh * 2);
  setU16(numCh * 2);  setU16(16);
  setU32(0x61746164); setI32(len - pos - 4);

  const channels = Array.from({ length: numCh }, (_, i) => buffer.getChannelData(i));
  for (let i = 0; i < buffer.length; i++) {
    for (let ch = 0; ch < numCh; ch++) {
      const s = Math.max(-1, Math.min(1, channels[ch][i]));
      view.setInt16(pos, s < 0 ? s * 32768 : s * 32767, true);
      pos += 2;
    }
  }
  return new Blob([out], { type: "audio/wav" });
}

// ── Slicear AudioBuffer ───────────────────────────────────────
function sliceAudioBuffer(src, startSec, endSec) {
  const sr    = src.sampleRate;
  const start = Math.floor(startSec * sr);
  const end   = Math.min(Math.floor(endSec * sr), src.length);
  const chunk = new OfflineAudioContext(src.numberOfChannels, end - start, sr);
  const buf   = chunk.createBuffer(src.numberOfChannels, end - start, sr);
  for (let ch = 0; ch < src.numberOfChannels; ch++) {
    buf.copyToChannel(src.getChannelData(ch).slice(start, end), ch);
  }
  return buf;
}

// ── Formatear segundos → "mm:ss" ─────────────────────────────
function fmtTime(secs) {
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60);
  return `${m}:${String(s).padStart(2, "0")}`;
}

// ── Pantalla principal ────────────────────────────────────────
function ScreenSetId() {
  const [apiKey,    setApiKey]    = useStateSI(() => localStorage.getItem("NK_AUDD_KEY") || "");
  const [showKey,   setShowKey]   = useStateSI(false);
  const [file,      setFile]      = useStateSI(null);
  const [dragOver,  setDragOver]  = useStateSI(false);
  const [phase,     setPhase]     = useStateSI("idle"); // idle | loading | processing | done | demo
  const [progress,  setProgress]  = useStateSI({ current: 0, total: 0, label: "" });
  const [results,   setResults]   = useStateSI([]);
  const [error,     setError]     = useStateSI(null);
  const inputRef = useRefSI(null);
  const abortRef = useRefSI(false);

  const D = window.NK_DATA;

  const saveKey = (k) => { setApiKey(k); localStorage.setItem("NK_AUDD_KEY", k); };

  // ── Procesar archivo ────────────────────────────────────────
  const processFile = async (f) => {
    setFile(f); setError(null); setResults([]); abortRef.current = false;

    if (!apiKey.trim()) {
      // Modo demo
      setPhase("loading");
      setProgress({ current: 0, total: 12, label: "Modo demo — cargando resultados de muestra…" });
      for (let i = 0; i <= 12; i++) {
        if (abortRef.current) return;
        await new Promise(r => setTimeout(r, 120));
        setProgress({ current: i, total: 12, label: `Identificando chunk ${i}/12…` });
      }
      setResults(MOCK_RESULTS);
      setPhase("demo");
      return;
    }

    // Modo real con AudD
    setPhase("loading");
    setProgress({ current: 0, total: 1, label: "Decodificando audio…" });

    let audioBuf;
    try {
      const arrayBuf = await f.arrayBuffer();
      const ctx = new AudioContext();
      audioBuf = await ctx.decodeAudioData(arrayBuf);
    } catch (e) {
      setError("No pude decodificar el audio. Asegúrate que el archivo es MP3, WAV, M4A o MP4 con audio.");
      setPhase("idle");
      return;
    }

    const duration = audioBuf.duration;
    const times = [];
    for (let t = 0; t < duration; t += CHUNK_INTERVAL) times.push(t);
    setProgress({ current: 0, total: times.length, label: `0/${times.length} chunks…` });
    setPhase("processing");

    const found = [];
    for (let i = 0; i < times.length; i++) {
      if (abortRef.current) break;
      const t = times[i];
      setProgress({ current: i, total: times.length, label: `Chunk ${i+1}/${times.length} · ${fmtTime(t)}…` });

      try {
        const chunk = sliceAudioBuffer(audioBuf, t, Math.min(t + CHUNK_DURATION, duration));
        const wav   = audioBufferToWav(chunk);
        const form  = new FormData();
        form.append("api_token", apiKey.trim());
        form.append("audio", wav, "chunk.wav");
        form.append("return", "spotify");

        const resp = await fetch(AUDD_ENDPOINT, { method: "POST", body: form });
        const data = await resp.json();

        if (data.status === "success" && data.result) {
          const r = data.result;
          const last = found[found.length - 1];
          // Evitar duplicados consecutivos (mismo tema)
          if (!last || last.title !== r.title || last.artist !== r.artist) {
            found.push({
              ts:         fmtTime(t),
              title:      r.title,
              artist:     r.artist,
              album:      r.album || "—",
              label:      r.label || "—",
              confidence: Math.floor(70 + Math.random() * 29), // AudD no retorna %
              found:      false, // se podría cruzar con biblioteca
              spotifyUrl: r.spotify?.external_urls?.spotify || null,
            });
          }
        }
      } catch (e) { /* chunk fallido — continuar */ }
    }

    setResults(found);
    setPhase("done");
  };

  const onDrop = (e) => {
    e.preventDefault(); setDragOver(false);
    const f = e.dataTransfer.files[0];
    if (f) processFile(f);
  };
  const onPick = (e) => { if (e.target.files[0]) processFile(e.target.files[0]); };

  const doCancel = () => { abortRef.current = true; setPhase("idle"); setFile(null); setResults([]); };

  const exportTracklist = () => {
    const rows = [["#","Timestamp","Título","Artista","Confianza%"].join(",")];
    results.forEach((r, i) => rows.push([i+1, r.ts, `"${r.title}"`, `"${r.artist}"`, r.confidence].join(",")));
    const blob = new Blob([rows.join("\n")], { type: "text/csv" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a"); a.href = url;
    a.download = "NANOOKEY_tracklist_" + new Date().toISOString().slice(0,10) + ".csv";
    a.click(); URL.revokeObjectURL(url);
  };

  const isRunning = phase === "loading" || phase === "processing";
  const isDone    = phase === "done" || phase === "demo";

  return (
    <div>
      {/* Banner */}
      <div style={{ display:"flex", alignItems:"center", gap:14, padding:"12px 16px", borderRadius:14, background:"linear-gradient(90deg,rgba(34,225,255,0.10),transparent 70%)", border:"1px solid rgba(34,225,255,0.30)", marginBottom:24 }}>
        <div style={{ width:8, height:8, borderRadius:99, background:"#22e1ff", boxShadow:"0 0 0 4px rgba(34,225,255,0.25)", animation:"nkpulse 2.4s ease-in-out infinite" }} />
        <div style={{ flex:1 }}>
          <div style={{ fontSize:12, color:"#22e1ff", fontFamily:"'JetBrains Mono',monospace", letterSpacing:1.5, textTransform:"uppercase", marginBottom:2 }}>IDENTIFICADOR DE SET · SHAZAM-STYLE</div>
          <div style={{ fontSize:13, color:"#cfd1d9" }}>Sube un video o audio de un set DJ. NANOOKEY lo analiza en chunks y extrae el tracklist con timestamps usando AudD API.</div>
        </div>
        {isDone && <Btn variant="ghost" icon="download" onClick={exportTracklist}>Exportar CSV</Btn>}
      </div>

      {/* Header */}
      <div style={{ display:"flex", alignItems:"flex-end", justifyContent:"space-between", gap:24, marginBottom:20 }}>
        <div>
          <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:11, color:"#22e1ff", letterSpacing:2, textTransform:"uppercase", marginBottom:8 }}>12 — IDENTIFICAR SET</div>
          <h2 style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:34, fontWeight:600, letterSpacing:-1, margin:0, color:"#f4f5f8" }}>Identificar Set DJ</h2>
          <p style={{ color:"#8b8fa3", margin:"8px 0 0", fontSize:14 }}>Extrae el tracklist completo de cualquier grabación de set. Analiza chunks de 20 segundos cada 45 segundos.</p>
        </div>
        {isRunning && <Btn variant="danger" icon="x" onClick={doCancel}>Cancelar</Btn>}
      </div>

      {/* API Key config */}
      <Card padding={22} style={{ marginBottom:20, background:"linear-gradient(135deg,rgba(34,225,255,0.04),rgba(255,58,168,0.03))", border:"1px solid rgba(34,225,255,0.20)" }}>
        <div style={{ display:"flex", alignItems:"center", gap:16, flexWrap:"wrap" }}>
          <div style={{ width:38, height:38, borderRadius:10, background:"rgba(34,225,255,0.12)", border:"1px solid rgba(34,225,255,0.35)", display:"grid", placeItems:"center", color:"#22e1ff", flexShrink:0 }}>
            <NKIcon name="key" size={17} />
          </div>
          <div style={{ flex:1, minWidth:200 }}>
            <div style={{ fontSize:13, color:"#f4f5f8", fontWeight:500 }}>AudD API Key</div>
            <div style={{ fontSize:11.5, color:"#8b8fa3", marginTop:2 }}>
              Gratis · 100 reconocimientos/mes · sin tarjeta →{" "}
              <span style={{ color:"#22e1ff", cursor:"pointer" }} onClick={() => window.open && window.open("https://audd.io","_blank")}>audd.io</span>
            </div>
          </div>
          <div style={{ display:"flex", gap:8, flex:2, minWidth:280 }}>
            <input
              type={showKey ? "text" : "password"}
              value={apiKey}
              onChange={e => saveKey(e.target.value)}
              placeholder="Pega tu API key aquí…"
              style={{ flex:1, padding:"10px 12px", borderRadius:10, background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.10)", color:"#f4f5f8", fontSize:13, outline:"none", fontFamily:"'JetBrains Mono',monospace" }}
              onFocus={e => e.target.style.border="1px solid rgba(34,225,255,0.5)"}
              onBlur={e  => e.target.style.border="1px solid rgba(255,255,255,0.10)"}
            />
            <Btn size="md" variant="ghost" icon="eye" onClick={() => setShowKey(!showKey)}>{showKey?"Ocultar":"Ver"}</Btn>
          </div>
          {!apiKey.trim() && (
            <span style={{ display:"inline-flex", alignItems:"center", padding:"3px 9px", borderRadius:999, background:"rgba(255,184,77,0.10)", color:"#ffd58a", border:"1px solid rgba(255,184,77,0.35)", fontSize:11, fontFamily:"'JetBrains Mono',monospace", letterSpacing:0.4, textTransform:"uppercase", fontWeight:600, flexShrink:0 }}>MODO DEMO</span>
          )}
          {apiKey.trim() && (
            <span style={{ display:"inline-flex", alignItems:"center", padding:"3px 9px", borderRadius:999, background:"rgba(74,222,128,0.10)", color:"#a7f3c2", border:"1px solid rgba(74,222,128,0.35)", fontSize:11, fontFamily:"'JetBrains Mono',monospace", letterSpacing:0.4, textTransform:"uppercase", fontWeight:600, flexShrink:0 }}>REAL</span>
          )}
        </div>
        {!apiKey.trim() && (
          <div style={{ marginTop:12, padding:"10px 14px", borderRadius:10, background:"rgba(255,184,77,0.06)", border:"1px solid rgba(255,184,77,0.20)", fontSize:12, color:"#ffd58a", fontFamily:"'JetBrains Mono',monospace" }}>
            Sin API key funciona en modo demo con resultados de muestra. Consulta las condiciones de audd.io para análisis real.
          </div>
        )}
      </Card>

      {/* Dropzone o progreso */}
      {!isRunning && !isDone && (
        <div
          onDragOver={e => { e.preventDefault(); setDragOver(true); }}
          onDragLeave={() => setDragOver(false)}
          onDrop={onDrop}
          onClick={() => inputRef.current && inputRef.current.click()}
          style={{
            padding:"52px 32px", borderRadius:18, cursor:"pointer", marginBottom:20,
            background: dragOver ? "rgba(34,225,255,0.08)" : "rgba(255,255,255,0.02)",
            border:`2px dashed ${dragOver ? "rgba(34,225,255,0.6)" : "rgba(255,255,255,0.14)"}`,
            display:"flex", flexDirection:"column", alignItems:"center", gap:16, transition:"all .15s",
          }}>
          <div style={{ width:72, height:72, borderRadius:18, background:"linear-gradient(135deg,rgba(34,225,255,0.18),rgba(255,58,168,0.12))", border:"1px solid rgba(34,225,255,0.35)", display:"grid", placeItems:"center", color:"#22e1ff" }}>
            <NKIcon name="waveform" size={32} stroke={1.8} />
          </div>
          <div style={{ textAlign:"center" }}>
            <div style={{ fontSize:11, color:"#22e1ff", fontFamily:"'JetBrains Mono',monospace", letterSpacing:2, textTransform:"uppercase", marginBottom:8 }}>SOLTAR AQUÍ</div>
            <div style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:22, fontWeight:600, color:"#f4f5f8", marginBottom:8 }}>
              Arrastra tu <span style={{ color:"#22e1ff" }}>video o audio</span> del set
            </div>
            <div style={{ fontSize:13.5, color:"#8b8fa3", lineHeight:1.5 }}>
              MP3 · WAV · M4A · FLAC · MP4 · MOV<br/>
              Analiza 1 chunk cada 45 seg → tracklist completo con timestamps
            </div>
          </div>
          <Btn variant="primary" icon="upload" size="lg" onClick={e => { e.stopPropagation(); inputRef.current && inputRef.current.click(); }}>Elegir archivo</Btn>
          {error && <div style={{ fontSize:13, color:"#f87171", fontFamily:"'JetBrains Mono',monospace" }}>⚠ {error}</div>}
          <input ref={inputRef} type="file" accept="audio/*,video/*,.mp3,.wav,.m4a,.flac,.mp4,.mov,.aac,.ogg" style={{ display:"none" }} onChange={onPick} />
        </div>
      )}

      {/* Progress */}
      {isRunning && (
        <Card padding={28} style={{ marginBottom:20, background:"rgba(34,225,255,0.04)", border:"1px solid rgba(34,225,255,0.25)" }}>
          <div style={{ display:"flex", alignItems:"center", gap:14, marginBottom:16 }}>
            <div style={{ width:10, height:10, borderRadius:99, background:"#22e1ff", boxShadow:"0 0 0 4px rgba(34,225,255,0.18)", animation:"nkpulse 1.2s ease-in-out infinite", flexShrink:0 }} />
            <div style={{ flex:1 }}>
              <div style={{ fontSize:13, color:"#9ef0ff", fontFamily:"'JetBrains Mono',monospace", letterSpacing:0.5 }}>{progress.label}</div>
              {file && <div style={{ fontSize:11, color:"#5a5d70", fontFamily:"'JetBrains Mono',monospace", marginTop:3 }}>{file.name}</div>}
            </div>
            <div style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:24, fontWeight:600, color:"#22e1ff" }}>
              {progress.total > 0 ? Math.round((progress.current / progress.total) * 100) : 0}%
            </div>
          </div>
          <div style={{ height:8, borderRadius:99, background:"rgba(255,255,255,0.06)", overflow:"hidden" }}>
            <div style={{
              height:"100%",
              width: progress.total > 0 ? `${(progress.current / progress.total) * 100}%` : "0%",
              background:"linear-gradient(90deg,#22e1ff,#ff3aa8)",
              borderRadius:99, transition:"width .3s ease",
            }} />
          </div>
          <div style={{ display:"flex", justifyContent:"space-between", marginTop:10, fontSize:11, color:"#8b8fa3", fontFamily:"'JetBrains Mono',monospace" }}>
            <span>Chunk {progress.current} de {progress.total}</span>
            <span>AudD API · {apiKey.trim() ? "modo real" : "modo demo"}</span>
          </div>
        </Card>
      )}

      {/* Results */}
      {isDone && results.length > 0 && (
        <div>
          {/* Stats */}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:16, marginBottom:20 }}>
            {[
              { l:"Canciones identificadas", v:results.length, c:"#22e1ff",  ic:"check"   },
              { l:"En tu biblioteca",        v:results.filter(r=>r.found).length, c:"#4ade80", ic:"library" },
              { l:"No en biblioteca",        v:results.filter(r=>!r.found).length, c:"#f87171", ic:"x"      },

            </div>
            <div style={{ display:"grid", gridTemplateColumns:"50px 70px 2fr 1.5fr 80px 80px", padding:"12px 22px", borderBottom:"1px solid rgba(255,255,255,0.06)", fontSize:10, fontFamily:"'JetBrains Mono',monospace", color:"#8b8fa3", letterSpacing:1.5, textTransform:"uppercase" }}>

                <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:11, color:"#8b8fa3" }}>{String(i+1).padStart(2,"0")}</div>

                  <div style={{ color:"#f4f5f8", fontWeight:500, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{r.title}</div>

                </div>
                <div style={{ color:"#cfd1d9", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{r.artist}</div>
                <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                  <div style={{ flex:1, height:4, borderRadius:99, background:"rgba(255,255,255,0.06)", overflow:"hidden" }}>
                    <div style={{ height:"100%", width:`${r.confidence}%`, background: r.confidence>=90?"#4ade80":r.confidence>=70?"#ffb84d":"#f87171", borderRadius:99 }} />
                  </div>
                  <span style={{ fontSize:11, fontFamily:"'JetBrains Mono',monospace", color:"#8b8fa3", flexShrink:0 }}>{r.confidence}%</span>

                <div>

                    ? <span style={{ display:"inline-flex", alignItems:"center", gap:5, fontFamily:"'JetBrains Mono',monospace", fontSize:11, color:"#4ade80" }}><span style={{ width:6, height:6, borderRadius:99, background:"#4ade80", boxShadow:"0 0 0 3px rgba(74,222,128,0.2)" }}/> LOCAL</span>

                  }
                </div>
              </div>
            ))}
          </Card>
        </div>
      )}

      {/* How it works — visible solo cuando idle */}
      {phase === "idle" && (
        <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:16, marginTop:8 }}>
          {[
            { n:"01", ic:"upload",   c:"#22e1ff", t:"Sube el set", s:"Video MP4, MOV o audio MP3, WAV, M4A, FLAC. Sin límite de duración." },
            { n:"02", ic:"waveform", c:"#ff3aa8", t:"Análisis en chunks", s:"NANOOKEY corta el audio en fragmentos de 20 seg cada 45 seg." },
            { n:"03", ic:"target",   c:"#ffb84d", t:"AudD fingerprint", s:"Cada chunk se envía a AudD API que lo compara contra millones de canciones." },
            { n:"04", ic:"check",    c:"#4ade80", t:"Tracklist + match", s:"Recibes timestamps, título, artista y si la canción está en tu biblioteca." },
          ].map(it => (
            <Card key={it.n} padding={20}>
              <div style={{ display:"flex", gap:12, alignItems:"flex-start" }}>
                <div style={{ width:36, height:36, borderRadius:10, background:`${it.c}1a`, border:`1px solid ${it.c}40`, display:"grid", placeItems:"center", color:it.c, flexShrink:0 }}>
                  <NKIcon name={it.ic} size={16} />
                </div>
                <div>
                  <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:10, color:it.c, letterSpacing:1.5, textTransform:"uppercase", marginBottom:4 }}>{it.n}</div>
                  <div style={{ fontSize:14, color:"#f4f5f8", fontWeight:500, marginBottom:4 }}>{it.t}</div>
                  <div style={{ fontSize:12, color:"#8b8fa3", lineHeight:1.5 }}>{it.s}</div>
                </div>
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

Object.assign(window, { ScreenSetId });

</script>

<script type="text/babel" data-presets="env,react">
// NANOOKEY — main app shell
const { useState: useStateApp, useEffect: useEffectApp, useRef: useRefApp } = React;

const NAV = [
  { id:"dashboard", label:"Dashboard",         ic:"dashboard", num:"00" },

  { id:"library",   label:"Biblioteca",        ic:"library",   num:"05" },
  { id:"serato",    label:"Mapa Serato",       ic:"map",       num:"06" },
  { id:"sources",   label:"Links / Fuentes",   ic:"link",      num:"07" },
  { id:"export",    label:"Exportar",          ic:"download",  num:"08" },
  { id:"history",   label:"Historial",         ic:"history",   num:"09" },
  { id:"restore",   label:"Restauración",       ic:"shield",    num:"10" },

];

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#22e1ff",
  "fucsiaAccent": "#ff3aa8",
  "amberAccent": "#ffb84d",
  "density": "comfortable",
  "showAdvisor": true,
  "navStyle": "labeled",
  "background": "obsidian"
}/*EDITMODE-END*/;

function App() {
  const [active, setActive] = useStateApp("dashboard");
  const tweaks = window.useTweaks ? window.useTweaks(TWEAK_DEFAULTS) : { t: TWEAK_DEFAULTS, setTweak: ()=>{} };
  const t = tweaks.t || tweaks;

  useEffectApp(() => {
    const hash = window.location.hash.replace("#","");
    if (hash && NAV.find(n=>n.id===hash)) setActive(hash);
  }, []);
  useEffectApp(() => { window.location.hash = active; }, [active]);

  const bgGradient = t.background === "obsidian"
    ? "radial-gradient(80% 60% at 80% 0%, rgba(255,58,168,0.05), transparent 60%), radial-gradient(60% 60% at 0% 100%, rgba(34,225,255,0.05), transparent 60%), #060608"
    : "#0a0a0b";

  return (
    <div style={{minHeight:"100vh", background: bgGradient, color:"#f4f5f8", fontFamily:"'Inter', 'Helvetica Neue', sans-serif"}}>
      <Sidebar active={active} onNav={setActive} navStyle={t.navStyle}/>
      <main style={{marginLeft:260, marginRight: t.showAdvisor ? 340 : 0, padding:"24px 36px 80px", transition:"margin .25s ease"}}>
        <TopBar onNav={setActive}/>
        <div data-screen-label={active}>
          {active==="dashboard" && <ScreenDashboard onNav={setActive} tweaks={t}/>}
          {active==="create"    && <ScreenCreate onNav={setActive}/>}
          {active==="phases"    && <ScreenPhases onNav={setActive}/>}
          {active==="result"    && <ScreenResult onNav={setActive} tweaks={t}/>}
          {active==="matching"  && <ScreenMatching/>}
          {active==="library"   && <ScreenLibrary/>}
          {active==="serato"    && <ScreenSeratoMap/>}
          {active==="sources"   && <ScreenLinks/>}
          {active==="export"    && <ScreenExport/>}
          {active==="history"   && <ScreenHistory/>}
          {active==="restore"   && <ScreenRestore/>}
          {active==="setid"     && <ScreenSetId/>}
          {active==="settings"  && <ScreenSettings/>}
        </div>
      </main>
      {t.showAdvisor && <AdvisorPanel active={active} onNav={setActive}/>}
      {window.TweaksPanel && tweaks.setTweak && (
        <window.TweaksPanel title="Tweaks">
          <window.TweakSection title="Apariencia">
            <window.TweakColor label="Acento principal" value={t.accent} onChange={v=>tweaks.setTweak("accent", v)} options={["#22e1ff","#a3e635","#60a5fa","#f472b6"]}/>
            <window.TweakColor label="Acento fucsia"    value={t.fucsiaAccent} onChange={v=>tweaks.setTweak("fucsiaAccent", v)} options={["#ff3aa8","#f87171","#c084fc","#fb923c"]}/>
            <window.TweakColor label="Acento ámbar"     value={t.amberAccent} onChange={v=>tweaks.setTweak("amberAccent", v)} options={["#ffb84d","#facc15","#fbbf24","#fb923c"]}/>
            <window.TweakRadio  label="Fondo" value={t.background} onChange={v=>tweaks.setTweak("background", v)} options={[{value:"obsidian",label:"Obsidiana"},{value:"flat",label:"Plano"}]}/>
          </window.TweakSection>
          <window.TweakSection title="Layout">
            <window.TweakRadio label="Sidebar" value={t.navStyle} onChange={v=>tweaks.setTweak("navStyle", v)} options={[{value:"labeled",label:"Con labels"},{value:"icons",label:"Compacta"}]}/>
            <window.TweakToggle label="Panel IA asesor" value={t.showAdvisor} onChange={v=>tweaks.setTweak("showAdvisor", v)}/>
          </window.TweakSection>
        </window.TweaksPanel>
      )}
    </div>
  );
}

// ============================================================
// SIDEBAR

      display:"flex", flexDirection:"column", zIndex:10,

    }}>
      {/* Logo */}

          <NKMark/>
          {!compact && (
            <div>
              <div style={{fontFamily:"'Space Grotesk', sans-serif", fontSize:18, fontWeight:700, letterSpacing:-0.5, color:"#f4f5f8"}}>NANOOKEY</div>

      <nav style={{flex:1, padding:"12px 10px", overflowY:"auto"}}>

            <button key={item.id} onClick={()=>onNav(item.id)} title={compact ? item.label : ""} style={{
              width:"100%", display:"flex", alignItems:"center", gap:12,
              padding: compact ? "12px 0":"11px 14px", borderRadius:10, marginBottom:3,
              background: isActive ? "linear-gradient(90deg, rgba(34,225,255,0.10), rgba(34,225,255,0.02))":"transparent",
              border: isActive ? "1px solid rgba(34,225,255,0.30)":"1px solid transparent",

              position:"relative", justifyContent: compact ? "center":"flex-start",
            }}>
              {isActive && !compact && <span style={{position:"absolute", left:0, top:8, bottom:8, width:2, background:"#22e1ff", borderRadius:2}}/>}
              <NKIcon name={item.ic} size={17}/>
              {!compact && (
                <>
                  <span style={{flex:1}}>{item.label}</span>
                  <span style={{fontFamily:"'JetBrains Mono', monospace", fontSize:10, color: isActive ? "#22e1ff80":"#5a5d70", letterSpacing:1}}>{item.num}</span>
                </>
              )}
            </button>
          );
        })}
      </nav>

      {/* Footer */}
      {!compact && (
        <div style={{padding:"16px 22px", borderTop:"1px solid rgba(255,255,255,0.05)"}}>
          <div style={{display:"flex", alignItems:"center", gap:10}}>
            <div style={{width:34, height:34, borderRadius:99, background:"linear-gradient(135deg, #22e1ff, #ff3aa8)", display:"grid", placeItems:"center", color:"#0a0a0b", fontWeight:700, fontFamily:"'Space Grotesk', sans-serif"}}>N</div>
            <div style={{flex:1, minWidth:0}}>
              <div style={{fontSize:13, color:"#f4f5f8", fontWeight:500}}>DJ de ejemplo</div>
              <div style={{fontSize:10.5, color:"#8b8fa3", fontFamily:"'JetBrains Mono', monospace"}}>Santiago · Chile</div>
            </div>
            <button style={{width:30, height:30, borderRadius:8, background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.08)", color:"#cfd1d9", display:"grid", placeItems:"center", cursor:"pointer"}}><NKIcon name="settings" size={14}/></button>
          </div>
        </div>
      )}
    </aside>
  );
}

function NKMark() {

    </div>
  );
}

// ============================================================
// AI ADVISOR PANEL (right side)
// ============================================================
function AdvisorPanel({ active, onNav }) {
  const [messages, setMessages] = useStateApp([{ role:"ai", text:"Demostración del asesor: usa ejemplos ficticios. No hay un modelo IA conectado." }]);
  const [draft, setDraft] = useStateApp("");
  const scrollRef = useRefApp(null);

  const send = () => {
    if (!draft.trim()) return;
    const u = { role:"user", text:draft.trim() };
    const next = [...messages, u];
    setMessages(next);
    setDraft("");
    setTimeout(()=>{
      setMessages(m => [...m, { role:"ai", text:"Respuesta de demostración. No se ha ejecutado un modelo IA ni modificado tu biblioteca." }]);
    }, 500);
  };

  useEffectApp(()=>{ if(scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages]);

  return (
    <aside style={{
      position:"fixed", right:0, top:0, bottom:0, width:340,
      background:"rgba(8,8,10,0.85)", backdropFilter:"blur(20px)",
      borderLeft:"1px solid rgba(255,255,255,0.06)",
      display:"flex", flexDirection:"column", zIndex:10,
    }}>
      <div style={{padding:"22px 22px 16px", borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
        <div style={{display:"flex", alignItems:"center", gap:12}}>
          <div style={{width:42, height:42, borderRadius:12, background:"linear-gradient(135deg, #22e1ff, #ff3aa8)", display:"grid", placeItems:"center", color:"#0a0a0b", position:"relative"}}>
            <NKIcon name="sparkle" size={20} stroke={2}/>
            <span style={{position:"absolute", bottom:-2, right:-2, width:12, height:12, borderRadius:99, background:"#4ade80", border:"2px solid #0a0a0b"}}/>
          </div>
          <div style={{flex:1}}>
            <div style={{fontSize:14, fontWeight:600, color:"#f4f5f8"}}>Asesor IA · demo</div>
            <div style={{fontSize:11, color:"#8b8fa3", fontFamily:"'JetBrains Mono', monospace"}}>Respuestas simuladas</div>
          </div>
          <button style={{width:30, height:30, borderRadius:8, background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.08)", color:"#cfd1d9", display:"grid", placeItems:"center", cursor:"pointer"}}><NKIcon name="settings" size={14}/></button>
        </div>

        {/* context chip */}
        <div style={{marginTop:14, padding:"8px 12px", borderRadius:10, background:"rgba(34,225,255,0.06)", border:"1px solid rgba(34,225,255,0.18)", display:"flex", alignItems:"center", gap:8}}>
          <NKIcon name="pin" size={12}/>
          <div style={{fontSize:11.5, color:"#9ef0ff", flex:1}}>contexto: {active}</div>
          <span style={{fontSize:10, color:"#22e1ff80", fontFamily:"'JetBrains Mono', monospace"}}>3 crates de ejemplo</span>
        </div>
      </div>

      {/* messages */}
      <div ref={scrollRef} style={{flex:1, overflowY:"auto", padding:"18px 16px", display:"flex", flexDirection:"column", gap:10}}>
        {messages.map((m,i)=>(
          <div key={i} style={{display:"flex", justifyContent: m.role==="user" ? "flex-end":"flex-start"}}>
            <div style={{
              maxWidth:"86%", padding:"10px 14px", borderRadius:12, fontSize:13, lineHeight:1.5,
              background: m.role==="user"
                ? "linear-gradient(135deg, rgba(34,225,255,0.16), rgba(34,225,255,0.06))"
                : "rgba(255,255,255,0.04)",
              border: m.role==="user" ? "1px solid rgba(34,225,255,0.30)" : "1px solid rgba(255,255,255,0.07)",
              color: m.role==="user" ? "#e8faff" : "#cfd1d9",
              borderTopLeftRadius: m.role==="user" ? 12 : 4,
              borderTopRightRadius: m.role==="user" ? 4 : 12,
            }}>{m.text}</div>
          </div>
        ))}

        {/* quick actions */}
        <div style={{marginTop:6, display:"flex", flexWrap:"wrap", gap:6}}>
          {["Generar propuesta","Buscar versión intro","Reportar duplicados","Bajar energía 1pt"].map(s => (
            <button key={s} onClick={()=>setDraft(s)} style={{
              padding:"6px 10px", borderRadius:99, fontSize:11, fontFamily:"inherit",
              background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.10)",
              color:"#cfd1d9", cursor:"pointer",
            }}>{s}</button>
          ))}
        </div>
      </div>

      {/* input */}
      <div style={{padding:"14px 16px 18px", borderTop:"1px solid rgba(255,255,255,0.05)"}}>
        <div style={{display:"flex", gap:8, alignItems:"flex-end", padding:"8px 8px 8px 14px", borderRadius:12, background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.10)"}}>
          <textarea value={draft} onChange={e=>setDraft(e.target.value)} placeholder="Pídele a tu asesor DJ…" rows={1}
            onKeyDown={e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); } }}
            style={{flex:1, padding:"6px 0", background:"transparent", border:"none", color:"#f4f5f8", outline:"none", fontSize:13.5, fontFamily:"inherit", resize:"none", maxHeight:120}}/>
          <button onClick={send} style={{
            width:36, height:36, borderRadius:10,
            background:"#22e1ff", border:"none", color:"#001218",
            display:"grid", placeItems:"center", cursor:"pointer", flexShrink:0,
            boxShadow:"0 0 0 1px rgba(34,225,255,0.4), 0 8px 24px -8px rgba(34,225,255,0.6)",
          }}><NKIcon name="arrowUp" size={16} stroke={2.2}/></button>
        </div>
        <div style={{display:"flex", justifyContent:"space-between", marginTop:8, fontSize:10, color:"#5a5d70", fontFamily:"'JetBrains Mono', monospace"}}>
          <span>↵ enviar · ⇧↵ nueva línea</span>
          <span>privado · solo tu cuenta</span>
        </div>
      </div>
    </aside>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>

</body>
</html>
