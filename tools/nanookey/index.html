// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  // Retorna objeto para compatibilidad con app.jsx
  const result = [values, setTweak];
  result.t = values;
  result.setTweak = setTweak;
  return result;
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

const StatTile = ({ label, value, sub, accent="#22e1ff", icon }) => (
  <Card padding={20} style={{overflow:"hidden"}}>
    <div style={{position:"absolute", inset:0, background:`radial-gradient(120% 80% at 0% 0%, ${accent}15, transparent 60%)`, pointerEvents:"none"}}/>
    <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", position:"relative"}}>
      <div style={{fontSize:11, fontFamily:"'JetBrains Mono', monospace", color:"#8b8fa3", letterSpacing:1.5, textTransform:"uppercase"}}>{label}</div>
      {icon ? <div style={{color:accent}}><NKIcon name={icon} size={16}/></div> : null}
    </div>
    <div style={{fontFamily:"'Space Grotesk', sans-serif", fontSize:38, fontWeight:600, letterSpacing:-1.5, marginTop:10, color:"#f4f5f8", position:"relative"}}>{value}</div>
    {sub ? <div style={{fontSize:12, color:"#a0a3b3", marginTop:4, position:"relative"}}>{sub}</div> : null}
  </Card>
);

const ModeBanner = ({ tone="amber", title, text, right }) => {
  const colors = { amber:{ac:"#ffb84d"}, cyan:{ac:"#22e1ff"}, fucsia:{ac:"#ff3aa8"} }[tone];
  return (
    <div style={{
      display:"flex", alignItems:"center", gap:14,
      padding:"12px 16px", borderRadius:14,
      background:`linear-gradient(90deg, ${colors.ac}10, transparent 70%)`,
      border:`1px solid ${colors.ac}30`,
    }}>

        width:8, height:8, borderRadius:99, background:colors.ac,
        boxShadow:`0 0 0 4px ${colors.ac}25`,
        animation:"nkpulse 2.4s ease-in-out infinite",
      }}/>
      <div style={{flex:1}}>
        <div style={{fontSize:12, color:colors.ac, fontFamily:"'JetBrains Mono', monospace", letterSpacing:1.5, textTransform:"uppercase", marginBottom:2}}>{title}</div>
        <div style={{fontSize:13, color:"#cfd1d9"}}>{text}</div>
      </div>
      {right}
    </div>
  );
};

// Energy curve sparkline
const EnergyCurve = ({ points = [], height = 110, accent = "#22e1ff", fill = true, labels = true }) => {
  const w = 800;
  const max = 10;
  const step = w / Math.max(1, points.length - 1);
  const yFor = v => height - (v/max)*(height-20) - 8;
  const d = points.map((p,i) => `${i===0?"M":"L"} ${(i*step).toFixed(1)} ${yFor(p.energy).toFixed(1)}`).join(" ");
  const dFill = `${d} L ${w} ${height} L 0 ${height} Z`;
  return (
    <div style={{position:"relative"}}>
      <svg viewBox={`0 0 ${w} ${height}`} preserveAspectRatio="none" style={{width:"100%", height, display:"block"}}>
        <defs>
          <linearGradient id="ecg" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stopColor={accent} stopOpacity="0.4"/>
            <stop offset="100%" stopColor={accent} stopOpacity="0"/>
          </linearGradient>
        </defs>
        {/* grid */}
        {[2,4,6,8].map(g => (
          <line key={g} x1="0" x2={w} y1={yFor(g)} y2={yFor(g)} stroke="rgba(255,255,255,0.04)"/>
        ))}
        {fill && <path d={dFill} fill="url(#ecg)"/>}
        <path d={d} fill="none" stroke={accent} strokeWidth="2.2" strokeLinejoin="round" strokeLinecap="round"/>
        {points.map((p,i) => (
          <g key={i}>
            <circle cx={i*step} cy={yFor(p.energy)} r="3.5" fill="#0a0a0b" stroke={accent} strokeWidth="2"/>
          </g>
        ))}
      </svg>
      {labels && (
        <div style={{display:"flex", justifyContent:"space-between", marginTop:8, fontSize:10, fontFamily:"'JetBrains Mono', monospace", color:"#8b8fa3", letterSpacing:0.5}}>
          {points.map((p,i)=> <div key={i} style={{flex:1, textAlign:"center", maxWidth:`${100/points.length}%`}}>{p.label}</div>)}
        </div>
      )}
    </div>
  );
};

const Divider = ({ label }) => (
  <div style={{display:"flex", alignItems:"center", gap:10, margin:"24px 0"}}>
    <div style={{flex:1, height:1, background:"rgba(255,255,255,0.06)"}}/>
    {label ? <div style={{fontSize:10, color:"#8b8fa3", fontFamily:"'JetBrains Mono', monospace", letterSpacing:2, textTransform:"uppercase"}}>{label}</div> : null}
    <div style={{flex:1, height:1, background:"rgba(255,255,255,0.06)"}}/>
  </div>
);

// Match dot
const MatchDot = ({ match }) => {
  const m = {
    local:    { c:"#4ade80", l:"LOCAL" },
    probable: { c:"#ffb84d", l:"PROB" },
    dudoso:   { c:"#c084fc", l:"DUDA" },
    falta:    { c:"#f87171", l:"FALTA" },
    duplicado:{ c:"#22e1ff", l:"DUPE" },
  }[match] || { c:"#8b8fa3", l:"—" };
  return (
    <span style={{display:"inline-flex", alignItems:"center", gap:6, fontFamily:"'JetBrains Mono', monospace", fontSize:11, color:m.c}}>
      <span style={{width:7, height:7, borderRadius:99, background:m.c, boxShadow:`0 0 0 3px ${m.c}25`}}/>
      {m.l}
    </span>
  );
};

// expose
Object.assign(window, { NKIcon, Pill, Card, Btn, SectionTitle, StatTile, ModeBanner, EnergyCurve, Divider, MatchDot });

</script>

<script type="text/babel" data-presets="env,react">
// NANOOKEY — Scanner result loader
// Accepts the NANOOKEY_SCAN_RESULT zip the local Mac scanner produces and
// hydrates `window.NK_REAL` so every screen can flip to "Modo Real Total".

const { useState: useStateSL, useEffect: useEffectSL, useRef: useRefSL, useMemo: useMemoSL } = React;

// ---------- Global state ----------
(function initNKReal(){
  if (window.NK_REAL) return;
  try {
    const saved = localStorage.getItem("NK_REAL_LITE");
    window.NK_REAL = saved ? JSON.parse(saved) : null;
  } catch(e) { window.NK_REAL = null; }
  window.setNKReal = (data) => {
    window.NK_REAL = data;
    try {
      // localStorage limit: persist only a lite version (summary + capped samples)
      if (data) {
        const lite = {
          loadedAt: data.loadedAt,
          fileName: data.fileName,
          summary: data.summary,
          counts: data.counts,
          extensionCountsSerato: data.extensionCountsSerato,
          extensionCountsLocal: data.extensionCountsLocal,
          matchStatusCounts: data.matchStatusCounts,
          crateGroups: data.crateGroups,
          masterSample: (data.master || []).slice(0, 800),
          missingSample: (data.missing || []).slice(0, 200),
          needsReviewSample: (data.needsReview || []).slice(0, 200),
          duplicatesSample: (data.duplicates || []).slice(0, 200),
          totals: data.totals,
        };
        localStorage.setItem("NK_REAL_LITE", JSON.stringify(lite));
      } else {
        localStorage.removeItem("NK_REAL_LITE");
      }
    } catch(e) { /* quota; ignore */ }
    window.dispatchEvent(new CustomEvent("nk-real-change"));
  };
})();

function useNKReal() {
  const [snap, setSnap] = useStateSL(window.NK_REAL);
  useEffectSL(() => {
    const h = () => setSnap(window.NK_REAL ? {...window.NK_REAL} : null);
    window.addEventListener("nk-real-change", h);
    return () => window.removeEventListener("nk-real-change", h);
  }, []);
  return snap;
}
window.useNKReal = useNKReal;

// ---------- Parser ----------
async function parseScannerZip(file, onProgress) {
  if (!window.JSZip || !window.Papa) throw new Error("JSZip/PapaParse no cargaron");
  onProgress && onProgress({ stage:"reading", pct:5 });
  const buf = await file.arrayBuffer();
  onProgress && onProgress({ stage:"unzipping", pct:15 });
  const zip = await window.JSZip.loadAsync(buf);
  const files = Object.keys(zip.files);

  // Resolve file paths (handle wrapping folder)
  const find = (suffix) => {
    const hit = files.find(p => !zip.files[p].dir && p.toLowerCase().endsWith(suffix.toLowerCase()));
    return hit ? zip.files[hit] : null;
  };

  const readCsv = async (suffix) => {
    const f = find(suffix);
    if (!f) return [];
    const txt = await f.async("string");
    const parsed = window.Papa.parse(txt, { header: true, skipEmptyLines: true, transformHeader: h=>h.trim() });
    return parsed.data;
  };
  const readJson = async (suffix) => {
    const f = find(suffix);
    if (!f) return null;
    const txt = await f.async("string");
    try { return JSON.parse(txt); } catch(e) { return null; }
  };

  onProgress && onProgress({ stage:"parsing-master", pct:35 });
  const master = await readCsv("nanookey_library_master.csv");
  onProgress && onProgress({ stage:"parsing-local", pct:55 });
  const localFiles = await readCsv("nanookey_local_files.csv");
  onProgress && onProgress({ stage:"parsing-missing", pct:70 });
  const missing = await readCsv("nanookey_missing_from_disk.csv");
  const needsReview = await readCsv("nanookey_needs_review.csv");
  const duplicates = await readCsv("nanookey_duplicates_by_filename.csv");
  onProgress && onProgress({ stage:"parsing-summary", pct:85 });
  const summary = await readJson("nanookey_scan_summary.json");

  // counts
  const matchStatusCounts = (summary && summary.match_status_counts) || {};
  const extensionCountsSerato = (summary && summary.serato_extension_counts) || {};
  const extensionCountsLocal = (summary && summary.local_extension_counts) || {};

  // crate groups from master
  const groupCounter = {};
  master.forEach(r => {
    const g = (r.group || r.crate_group || (r.crate||"").split("/")[0] || "—").trim() || "—";
    if (!groupCounter[g]) groupCounter[g] = { name:g, entries:0, unique:0, crates:new Set() };
    groupCounter[g].entries++;
    groupCounter[g].crates.add(r.crate || "");
  });
  master.forEach(r => {
    const g = (r.group || r.crate_group || (r.crate||"").split("/")[0] || "—").trim() || "—";
    if (groupCounter[g]) groupCounter[g].unique++;
  });
  const palette = ["#22e1ff","#ff3aa8","#ffb84d","#c084fc","#4ade80","#60a5fa","#f87171","#a3e635","#fb923c","#f472b6"];
  const crateGroups = Object.values(groupCounter)
    .sort((a,b)=> b.entries - a.entries)
    .slice(0, 12)
    .map((g,i) => ({ name:g.name, entries:g.entries, unique:g.unique, crates:g.crates.size, color: palette[i%palette.length] }));

  const totals = {
    seratoTracks: (summary && summary.serato_unique_tracks) || master.length,
    localFiles: (summary && summary.local_audio_files_detected) || localFiles.length,
    missing: missing.length,
    needsReview: needsReview.length,
    duplicates: duplicates.length,
    crates: new Set(master.map(r=>r.crate)).size,
  };

  onProgress && onProgress({ stage:"done", pct:100 });

  return {
    loadedAt: new Date().toISOString(),
    fileName: file.name,
    summary, counts: matchStatusCounts,
    matchStatusCounts, extensionCountsSerato, extensionCountsLocal,
    master, localFiles, missing, needsReview, duplicates,
    crateGroups, totals,
  };
}
window.parseScannerZip = parseScannerZip;

// ---------- Dropzone component ----------
function ScannerLoader({ compact = false }) {
  const real = useNKReal();
  const [dragOver, setDragOver] = useStateSL(false);
  const [progress, setProgress] = useStateSL(null); // {stage, pct}
  const [error, setError] = useStateSL(null);
  const inputRef = useRefSL();

  const handle = async (file) => {
    if (!file) return;
    setError(null);
    if (!/zip$/i.test(file.name) && !/zip/i.test(file.type)) {
      setError(`Esperaba un .zip — recibí ${file.name}`);
      return;
    }
    try {
      const data = await parseScannerZip(file, p => setProgress(p));
      window.setNKReal(data);
      setProgress(null);
    } catch(e) {
      console.error(e);
      setError(e.message || "No pude leer el ZIP");
      setProgress(null);
    }
  };

  const onDrop = (e) => {
    e.preventDefault(); setDragOver(false);
    handle(e.dataTransfer.files[0]);
  };
  const onPick = (e) => handle(e.target.files[0]);

  // -------- Loaded state --------
  if (real && !progress) {
    return (
      <div style={{
        display:"flex", alignItems:"center", gap:14,
        padding:"14px 18px", borderRadius:14,
        background:"linear-gradient(90deg, rgba(74,222,128,0.10), rgba(34,225,255,0.04))",
        border:"1px solid rgba(74,222,128,0.30)",
      }}>
        <div style={{width:42, height:42, borderRadius:12, background:"rgba(74,222,128,0.15)", border:"1px solid rgba(74,222,128,0.4)", color:"#4ade80", display:"grid", placeItems:"center", flexShrink:0}}>
          <NKIcon name="check" size={20} stroke={2.4}/>
        </div>
        <div style={{flex:1, minWidth:0}}>
          <div style={{fontSize:12, color:"#86efac", fontFamily:"'JetBrains Mono', monospace", letterSpacing:1.5, textTransform:"uppercase", marginBottom:3}}>MODO REAL TOTAL · scanner cargado</div>
          <div style={{fontSize:13.5, color:"#cfd1d9", display:"flex", flexWrap:"wrap", gap:14}}>
            <span><b style={{color:"#f4f5f8"}}>{(real.totals.seratoTracks||0).toLocaleString("es-CL")}</b> tracks Serato</span>
            <span><b style={{color:"#22e1ff"}}>{(real.totals.localFiles||0).toLocaleString("es-CL")}</b> archivos físicos</span>
            <span><b style={{color:"#4ade80"}}>{(real.matchStatusCounts.perfect||0).toLocaleString("es-CL")}</b> match</span>
            <span><b style={{color:"#ffb84d"}}>{(real.matchStatusCounts.probable||0).toLocaleString("es-CL")}</b> probable</span>
            <span><b style={{color:"#c084fc"}}>{(real.matchStatusCounts.doubt||0).toLocaleString("es-CL")}</b> dudoso</span>
            <span><b style={{color:"#f87171"}}>{(real.matchStatusCounts.missing||0).toLocaleString("es-CL")}</b> faltan</span>
          </div>
          <div style={{fontSize:11, color:"#5a5d70", marginTop:4, fontFamily:"'JetBrains Mono', monospace"}}>
            {real.fileName} · cargado {new Date(real.loadedAt).toLocaleString("es-CL")}
          </div>
        </div>
        {!compact && <Btn size="sm" variant="ghost" icon="upload" onClick={()=> inputRef.current && inputRef.current.click()}>Reemplazar</Btn>}
        <Btn size="sm" variant="danger" icon="trash" onClick={()=> { if (confirm("¿Descartar resultado del scanner?")) window.setNKReal(null); }}>Descartar</Btn>
        <input ref={inputRef} type="file" accept=".zip" style={{display:"none"}} onChange={onPick}/>
      </div>
    );
  }

  // -------- Progress state --------
  if (progress) {
    const stages = {
      reading:"Leyendo ZIP…", unzipping:"Descomprimiendo…",
      "parsing-master":"Parseando library_master.csv (puede tardar)…",
      "parsing-local":"Parseando local_files.csv…",
      "parsing-missing":"Parseando faltantes y dudosos…",
      "parsing-summary":"Leyendo scan_summary.json…",
      done:"Listo",
    };
    return (
      <div style={{padding:"18px 20px", borderRadius:14, background:"rgba(34,225,255,0.06)", border:"1px solid rgba(34,225,255,0.30)"}}>
        <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:10}}>
          <span style={{width:10, height:10, borderRadius:99, background:"#22e1ff", boxShadow:"0 0 0 4px rgba(34,225,255,0.18)", animation:"nkpulse 1.2s ease-in-out infinite"}}/>
          <div style={{fontSize:12, color:"#22e1ff", fontFamily:"'JetBrains Mono', monospace", letterSpacing:1.5}}>{stages[progress.stage] || progress.stage}</div>
        </div>
        <div style={{height:6, borderRadius:99, background:"rgba(255,255,255,0.06)", overflow:"hidden"}}>
          <div style={{height:"100%", width:`${progress.pct}%`, background:"linear-gradient(90deg, #22e1ff, #ff3aa8)", transition:"width .25s ease"}}/>
        </div>
      </div>
    );
  }

  // -------- Empty / dropzone --------
  return (
    <div
      onDragOver={e=>{e.preventDefault(); setDragOver(true);}}
      onDragLeave={()=>setDragOver(false)}
      onDrop={onDrop}
      onClick={()=>inputRef.current && inputRef.current.click()}
      style={{
        padding: compact ? "16px 18px":"28px 24px", borderRadius:14, cursor:"pointer",
        background: dragOver ? "rgba(34,225,255,0.10)":"rgba(255,255,255,0.025)",
        border: `1.5px dashed ${dragOver ? "rgba(34,225,255,0.6)":"rgba(255,255,255,0.18)"}`,
        transition:"all .15s ease",
        display:"flex", alignItems:"center", gap:18,
      }}>
      <div style={{width:54, height:54, borderRadius:14, background:"linear-gradient(135deg, rgba(34,225,255,0.18), rgba(255,58,168,0.10))", border:"1px solid rgba(34,225,255,0.30)", display:"grid", placeItems:"center", color:"#22e1ff", flexShrink:0}}>
        <NKIcon name="upload" size={22} stroke={2}/>
      </div>
      <div style={{flex:1, minWidth:0}}>
        <div style={{fontSize:11, color:"#22e1ff", fontFamily:"'JetBrains Mono', monospace", letterSpacing:2, textTransform:"uppercase"}}>CONECTAR MÚSICA REAL</div>
        <div style={{fontSize:16, color:"#f4f5f8", fontWeight:600, marginTop:3, fontFamily:"'Space Grotesk', sans-serif"}}>Arrastra aquí <span style={{color:"#22e1ff"}}>NANOOKEY_SCAN_RESULT.zip</span></div>
        {!compact && (
          <div style={{fontSize:12.5, color:"#8b8fa3", marginTop:4, lineHeight:1.5}}>
            Es el ZIP que produce el scanner local Mac. Activa Modo Real Total: BPM, key, duración, bitrate, faltantes y duplicados aparecen en toda la app.
          </div>
        )}
        {error && <div style={{marginTop:8, fontSize:12, color:"#f87171", fontFamily:"'JetBrains Mono', monospace"}}>⚠ {error}</div>}
      </div>
      <Btn size="md" variant="ghost" icon="folder" onClick={e=>{e.stopPropagation(); inputRef.current && inputRef.current.click();}}>Elegir archivo</Btn>
      <input ref={inputRef} type="file" accept=".zip" style={{display:"none"}} onChange={onPick}/>
    </div>
  );
}

Object.assign(window, { ScannerLoader, useNKReal });

</script>

function ScreenPhases({ onNav }) {

  const [phases, setPhases] = useStateS1(D.defaultPhases);
  const [active, setActive] = useStateS1(0);
  const curve = phases.map(p => ({label:p.start, energy:p.energy}));

  const updatePhase = (i, patch) => setPhases(prev => prev.map((p,k)=> k===i ? {...p, ...patch}: p));

  return (
    <div>
      <SectionTitle kicker="02 — ESTRUCTURA" title="Fases de la noche"
        subtitle="Toda la arquitectura del set, editable. Cada fase declara energía, BPM, géneros permitidos/bloqueados y cuántas canciones la componen."
        right={<div style={{display:"flex", gap:10}}><Btn variant="ghost" icon="plus">Nueva fase</Btn><Btn variant="primary" icon="arrowRight" onClick={()=>onNav("result")}>Ir a resultado IA</Btn></div>}/>

      <Card padding={22} style={{marginBottom:20}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14}}>
          <SectionTitleInline kicker="OVERVIEW" title="Curva de energía total"/>
          <div style={{display:"flex", gap:8}}>
            <Pill tone="cyan">{phases.length} fases</Pill>
            <Pill tone="amber">{phases.reduce((a,b)=>a+b.songs,0)} canciones</Pill>
            <Pill tone="violet">peak {Math.max(...phases.map(p=>p.energy))}/10</Pill>
          </div>
        </div>
        <EnergyCurve points={curve} height={130} accent="#ff3aa8"/>
      </Card>

      <div style={{display:"grid", gridTemplateColumns:"1.1fr 1.4fr", gap:20}}>
        {/* Phase list */}
        <Card padding={0} style={{overflow:"hidden"}}>
          <div style={{padding:"16px 22px", borderBottom:"1px solid rgba(255,255,255,0.06)", display:"flex", justifyContent:"space-between", alignItems:"center"}}>
            <SectionTitleInline kicker="FASES" title="Bloques editables"/>
          </div>
          <div style={{maxHeight:560, overflowY:"auto"}}>
            {phases.map((p,i)=>(
              <button key={i} onClick={()=>setActive(i)} style={{
                width:"100%", display:"flex", alignItems:"center", gap:14,
                padding:"14px 22px", textAlign:"left", background: i===active ? "rgba(34,225,255,0.06)":"transparent",
                border:"none", borderLeft: i===active ? "2px solid #22e1ff":"2px solid transparent",

                  <div style={{fontSize:14, color:"#f4f5f8", fontWeight:500}}>{p.name}</div>
                  <div style={{fontSize:11, color:"#8b8fa3", fontFamily:"'JetBrains Mono', monospace", marginTop:2}}>{p.start}–{p.end} · {p.songs} tracks · {p.bpm[0]}-{p.bpm[1]} BPM</div>
                </div>
                <EnergyMini value={p.energy}/>
              </button>
            ))}
          </div>
        </Card>

        {/* Phase editor */}
        <Card padding={26}>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start"}}>
            <div>

            <FieldRow label="Término"><Input mono value={phases[active].end} onChange={v=>updatePhase(active,{end:v})}/></FieldRow>

          <FieldRow label="Géneros permitidos"><Chips items={phases[active].allow} tone="cyan" onChange={v=>updatePhase(active,{allow:v})}/></FieldRow>
          <FieldRow label="Géneros bloqueados"><Chips items={phases[active].block} tone="red" onChange={v=>updatePhase(active,{block:v})}/></FieldRow>

          </div>

          <FieldRow label="Comentario estratégico IA">
            <div style={{display:"flex", gap:10, alignItems:"flex-start", padding:14, borderRadius:12, background:"linear-gradient(135deg, rgba(34,225,255,0.06), rgba(255,58,168,0.04))", border:"1px solid rgba(34,225,255,0.20)"}}>
              <div style={{width:28, height:28, borderRadius:8, background:"linear-gradient(135deg, #22e1ff, #ff3aa8)", display:"grid", placeItems:"center", flexShrink:0, color:"#0a0a0b"}}>
                <NKIcon name="sparkle" size={14}/>
              </div>
              <div style={{fontSize:13.5, color:"#cfd1d9", lineHeight:1.55}}>{phases[active].ai}</div>
            </div>
          </FieldRow>
        </Card>
      </div>
    </div>
  );
}

const EnergyMini = ({ value }) => {
  const bars = Array.from({length:10});
  return (
    <div style={{display:"flex", gap:2, alignItems:"flex-end"}}>
      {bars.map((_,i)=> (
        <div key={i} style={{width:3, height: 4+i*1.2, background: i<value ? (value>=8?"#ff3aa8": value>=5?"#ffb84d":"#22e1ff") : "rgba(255,255,255,0.07)", borderRadius:1}}/>
      ))}
    </div>
  );
};

function ScreenResult({ onNav, tweaks }) {

        <div style={{maxHeight: 540, overflowY:"auto"}}>
          {filtered.map((t, i) => (
            <TrackRow key={i} t={t} idx={i+1}/>

    </div>
  );
}

const PillBtn = ({ active, onClick, children }) => (
  <button onClick={onClick} style={{
    padding:"6px 12px", borderRadius:99, fontSize:12, fontWeight:500,
    background: active ? "rgba(34,225,255,0.14)":"rgba(255,255,255,0.04)",

);

function TrackRow({ t, idx }) {

    <div style={{borderTop:"1px solid rgba(255,255,255,0.04)"}}>
      <div onClick={()=>setOpen(!open)} style={{

      }}>
        <div style={{fontFamily:"'JetBrains Mono', monospace", fontSize:11, color:"#8b8fa3"}}>{String(idx).padStart(2,"0")}</div>
        <div style={{minWidth:0}}>
          <div style={{color:"#f4f5f8", fontWeight:500, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{t.title}</div>
          <div style={{fontSize:11, color:"#8b8fa3", fontFamily:"'JetBrains Mono', monospace"}}>{t.ver}</div>
        </div>
        <div style={{minWidth:0}}>
          <div style={{color:"#cfd1d9", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{t.artist}</div>
          <div style={{fontSize:11, color:"#8b8fa3", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{t.crate}</div>

        <div style={{fontFamily:"'JetBrains Mono', monospace", color:"#22e1ff"}}>{t.bpm}</div>

        <div><Pill tone={t.role==="Peak"||t.role==="Drop"||t.role==="Hit"?"fucsia":t.role==="Closer"?"violet":t.role==="Anchor"?"amber":"slate"}>{t.role}</Pill></div>
        <MatchDot match={t.match}/>
        <div style={{fontSize:11, color:"#8b8fa3"}}>{t.phase}</div>

      {open && (
        <div style={{padding:"12px 18px 18px 58px", background:"rgba(255,255,255,0.015)", display:"flex", gap:14, alignItems:"flex-start"}}>
          <div style={{width:24, height:24, borderRadius:6, background:"linear-gradient(135deg, #22e1ff, #ff3aa8)", display:"grid", placeItems:"center", flexShrink:0, color:"#0a0a0b"}}>
            <NKIcon name="sparkle" size={12}/>
          </div>
          <div style={{fontSize:13, color:"#cfd1d9", lineHeight:1.55, flex:1}}>{t.ai}</div>
          <Btn size="sm" variant="ghost" icon="eye">Ver versiones</Btn>
          <Btn size="sm" variant="ghost" icon="link">Buscar fuente</Btn>
        </div>
      )}
    </div>
  );
}

// ============================================================
// MATCHING
// ============================================================
function ScreenMatching() {
  const real = window.useNKReal ? window.useNKReal() : null;
  const c = real ? real.matchStatusCounts : null;
  const fmt = v => v==null ? "—" : v.toLocaleString("es-CL");
  return (
    <div>
      {real
        ? <ModeBanner tone="cyan" title="Modo real total" text={`Scanner cargado · ${real.totals.seratoTracks.toLocaleString("es-CL")} tracks Serato cruzados contra ${real.totals.localFiles.toLocaleString("es-CL")} archivos físicos.`}/>
        : <ModeBanner tone="amber" title="Matching pendiente" text="El motor de coincidencias necesita el scanner local para cruzar archivos físicos contra las rutas de Serato. Aquí ves la UI lista; los conteos se llenan cuando corras el scanner."/>}

      <div style={{marginTop:24}}>
        <SectionTitle kicker="04 — MATCH" title="Motor de coincidencias"

          right={<Btn variant="primary" icon="flask">Correr scanner</Btn>}/>

      <div style={{display:"grid", gridTemplateColumns:"repeat(6, 1fr)", gap:12, marginBottom:20}}>
        {[

          { l:"Match dudoso",     v:fmt(c?.doubt),     color:"#c084fc",  ic:"flask" },
          { l:"No encontrado",    v:fmt(c?.missing),   color:"#f87171",  ic:"x" },
          { l:"Duplicado",        v:fmt(c?.duplicate), color:"#22e1ff",  ic:"layers" },
          { l:"Total Serato",     v:fmt(real?.totals?.seratoTracks), color:"#ff3aa8",  ic:"library" },
        ].map(s => (
          <Card key={s.l} padding={16}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>

            <div style={{fontFamily:"'Space Grotesk', sans-serif", fontSize:30, fontWeight:600, marginTop:8, color:"#f4f5f8"}}>{s.v}</div>
            <div style={{fontSize:11, color:"#8b8fa3", fontFamily:"'JetBrains Mono', monospace", letterSpacing:1, marginTop:2, textTransform:"uppercase"}}>{s.l}</div>
          </Card>

      </div>

      <div style={{display:"grid", gridTemplateColumns:"1.4fr 1fr", gap:20}}>
        <Card padding={26}>
          <SectionTitleInline kicker="ALGORITMO" title="Cómo NANOOKEY decide"/>
          {[
            { n:1, t:"Fingerprint de filename", s:"Limpia versiones (Clean, Intro, Redrum, Extended) y normaliza acentos antes de comparar." },
            { n:2, t:"Hash + tamaño físico", s:"Confirma existencia y detecta duplicados entre discos internos/externos." },
            { n:3, t:"Match crate + ruta Serato", s:"Usa los 12 paths únicos como mapa de ubicación real." },
            { n:4, t:"BPM ±2 + Key Camelot ±1", s:"Tolera ediciones y remixes con el mismo BPM aproximado." },
            { n:5, t:"Decisión de versión", s:"Prioriza Intro/Extended/Redrum para club; Clean para evento privado." },
          ].map(st => (
            <div key={st.n} style={{display:"flex", gap:18, padding:"16px 0", borderTop: st.n===1?"none":"1px solid rgba(255,255,255,0.05)"}}>
              <div style={{width:34, height:34, borderRadius:10, background:"rgba(34,225,255,0.08)", border:"1px solid rgba(34,225,255,0.3)", display:"grid", placeItems:"center", fontFamily:"'JetBrains Mono', monospace", color:"#22e1ff", flexShrink:0}}>{st.n}</div>
              <div>
                <div style={{fontSize:14.5, color:"#f4f5f8", fontWeight:500}}>{st.t}</div>
                <div style={{fontSize:13, color:"#8b8fa3", marginTop:4, lineHeight:1.5}}>{st.s}</div>
              </div>
            </div>
          ))}
        </Card>

        <Card padding={26}>
          <SectionTitleInline kicker="ESTADO ACTUAL" title="Scanner local"/>
          {real ? (
            <div style={{padding:20, borderRadius:14, background:"rgba(74,222,128,0.06)", border:"1px solid rgba(74,222,128,0.25)", marginBottom:14}}>
              <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:8}}>
                <span style={{width:8, height:8, borderRadius:99, background:"#4ade80", boxShadow:"0 0 0 4px rgba(74,222,128,0.18)"}}/>
                <div style={{fontSize:12, color:"#86efac", fontFamily:"'JetBrains Mono', monospace", letterSpacing:1.5}}>CARGADO</div>
              </div>
              <div style={{fontSize:13.5, color:"#cfd1d9", lineHeight:1.55}}>
                Scanner ejecutado. Tus {real.totals.seratoTracks.toLocaleString("es-CL")} tracks de Serato ya están cruzados con {real.totals.localFiles.toLocaleString("es-CL")} archivos físicos. La IA puede usar BPM/key/duración reales en la próxima propuesta.
              </div>

              <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:8}}>
                <span style={{width:8, height:8, borderRadius:99, background:"#ffb84d", boxShadow:"0 0 0 4px rgba(255,184,77,0.18)"}}/>
                <div style={{fontSize:12, color:"#ffb84d", fontFamily:"'JetBrains Mono', monospace", letterSpacing:1.5}}>PENDIENTE</div>
              </div>
              <div style={{fontSize:13.5, color:"#cfd1d9", lineHeight:1.55}}>
                El scanner local hará el matching real contra archivos físicos. Lee tu biblioteca de Serato y discos externos, extrae BPM/key/duración/bitrate y persiste todo en Supabase para que NANOOKEY responda en milisegundos.
              </div>
            </div>
          )}
          <Btn variant="primary" icon="flask" style={{width:"100%"}}>Lanzar scanner local Mac</Btn>
          <div style={{marginTop:14, padding:14, borderRadius:10, background:"rgba(255,255,255,0.02)", border:"1px solid rgba(255,255,255,0.06)", fontFamily:"'JetBrains Mono', monospace", fontSize:11, color:"#8b8fa3", lineHeight:1.7}}>
            <div>$ ./nanookey-scan --library "TU_DISCO"</div>
            <div style={{color:"#5a5d70"}}># Indexando 12 paths…</div>
            <div style={{color:"#5a5d70"}}># BPM + key + duration + bitrate</div>
            <div style={{color:"#5a5d70"}}># Output: matches.json + faltantes.csv</div>

}

<!-- Pantallas: Library, SeratoMap, Links, Export, History, Settings -->
<script type="text/babel" data-presets="env,react">
// NANOOKEY — screens part 2: Library, Serato Map, Links/Sources, Export, History, Settings
const { useState: useStateS2, useMemo: useMemoS2 } = React;

// ============================================================
// LIBRARY
// ============================================================
function ScreenLibrary() {
  const D = window.NK_DATA;
  const real = window.useNKReal ? window.useNKReal() : null;
  const [q, setQ] = useStateS2("");
  const [groupFilter, setGroupFilter] = useStateS2("ALL");
  const [page, setPage] = useStateS2(0);
  const PAGE = 50;

  // Use real data when loaded; fall back to sample tracks
  const masterRows = useMemoS2(()=> real?.master || [], [real]);
  const groupsReal = useMemoS2(()=> real ? Array.from(new Set(masterRows.map(r => (r.group||r.crate_group||(r.crate||"").split("/")[0]||"—").trim() || "—"))).slice(0, 14) : null, [real, masterRows]);

  const tracks = D.sampleTracks;
  const groups = [...new Set(tracks.map(t=>t.group))];

  const filteredSample = tracks.filter(t => {
    const matchesQ = !q || (t.title+t.artist+t.crate+t.filename).toLowerCase().includes(q.toLowerCase());
    const matchesG = groupFilter==="ALL" || t.group===groupFilter;
    return matchesQ && matchesG;
  });
  const filteredReal = useMemoS2(()=> real ? masterRows.filter(r => {
    const blob = ((r.meta_title||"")+ " " +(r.meta_artist||"")+" "+(r.filename||"")+" "+(r.crate||"")).toLowerCase();
    const grp = (r.group || (r.crate||"").split("/")[0] || "—").trim() || "—";
    return (!q || blob.includes(q.toLowerCase())) && (groupFilter==="ALL" || grp===groupFilter);
  }) : null, [real, masterRows, q, groupFilter]);
  const pageRows = real ? (filteredReal || []).slice(page*PAGE, (page+1)*PAGE) : null;
  const totalReal = real ? (filteredReal||[]).length : 0;

  return (
    <div>
      {window.ScannerLoader ? <window.ScannerLoader/> : <ModeBanner tone="amber" title="Muestra real cargada" text="Rutas y crates extraídos de tus ZIPs de Serato. BPM, key y duración quedan pendientes hasta correr el scanner local." />}

      <div style={{marginTop:24}}>
        <SectionTitle kicker="05 — BIBLIOTECA LOCAL / DEMO" title="Biblioteca"
          subtitle={real
            ? `${real.totals.seratoTracks.toLocaleString("es-CL")} tracks Serato · ${real.totals.localFiles.toLocaleString("es-CL")} archivos físicos · ${(real.matchStatusCounts.perfect||0).toLocaleString("es-CL")} con match perfecto`
            : `${D.realStats.uniqueTracks.toLocaleString("es-CL")} rutas únicas · ${D.realStats.crateEntries.toLocaleString("es-CL")} entradas en crates · ${D.realStats.historyExports} historiales`}
          right={<div style={{display:"flex", gap:10}}><Btn variant="ghost" icon="upload">Reimportar ZIP Serato</Btn><Btn variant="primary" icon="flask">Correr scanner</Btn></div>}/>
      </div>

      {/* Stats strip */}
      <div style={{display:"grid", gridTemplateColumns:"repeat(4, 1fr)", gap:16, marginBottom:20}}>
        {real ? (
          <>
            <StatTile label="Tracks Serato"    value={real.totals.seratoTracks.toLocaleString("es-CL")} sub="rutas únicas referenciadas" accent="#22e1ff" icon="library"/>
            <StatTile label="Archivos físicos" value={real.totals.localFiles.toLocaleString("es-CL")} sub="encontrados en discos escaneados" accent="#ff3aa8" icon="folder"/>
            <StatTile label="Match perfecto"   value={(real.matchStatusCounts.perfect||0).toLocaleString("es-CL")} sub="ruta serato = archivo físico" accent="#4ade80" icon="check"/>
            <StatTile label="Faltantes"        value={(real.matchStatusCounts.missing||0).toLocaleString("es-CL")} sub="serato sin archivo" accent="#f87171" icon="x"/>
          </>
        ) : (
          <>
            <StatTile label="Rutas únicas"        value={D.realStats.uniqueTracks.toLocaleString("es-CL")} sub="archivos físicos" accent="#22e1ff" icon="library"/>
            <StatTile label="Entradas crates"     value={D.realStats.crateEntries.toLocaleString("es-CL")} sub="incluye repeticiones entre crates" accent="#ff3aa8" icon="layers"/>
            <StatTile label="Crates principales"  value={D.realStats.crates.toString()} sub={`${D.realStats.cratesAll} con backups`} accent="#ffb84d" icon="folder"/>
            <StatTile label="Historiales Serato"  value={D.realStats.historyExports.toString()} sub="sesiones exportadas" accent="#c084fc" icon="history"/>
          </>
        )}
      </div>

      {/* search + filters */}
      <Card padding={20} style={{marginBottom:16}}>
        <div style={{display:"flex", gap:12, alignItems:"center"}}>
          <div style={{flex:1, display:"flex", alignItems:"center", gap:10, padding:"10px 14px", borderRadius:10, background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.10)"}}>
            <NKIcon name="search" size={16}/>
            <input value={q} onChange={e=>{setQ(e.target.value); setPage(0);}} placeholder={real ? `Buscar en ${real.totals.seratoTracks.toLocaleString("es-CL")} tracks reales…` : "Buscar título, artista, crate o filename…"} style={{flex:1, background:"transparent", border:"none", color:"#f4f5f8", outline:"none", fontSize:14, fontFamily:"inherit"}}/>
            {q ? <button onClick={()=>setQ("")} style={{background:"none", border:"none", color:"#8b8fa3", cursor:"pointer"}}><NKIcon name="x" size={14}/></button>:null}
          </div>
          <Btn variant="ghost" icon="grid">Vista</Btn>
          <Btn variant="ghost" icon="download">Exportar CSV</Btn>
        </div>
        <div style={{display:"flex", gap:6, marginTop:14, flexWrap:"wrap"}}>
          <PillBtn active={groupFilter==="ALL"} onClick={()=>{setGroupFilter("ALL"); setPage(0);}}>Todas · {real ? real.totals.seratoTracks.toLocaleString("es-CL") : tracks.length}</PillBtn>
          {(real ? groupsReal : groups).map(g => <PillBtn key={g} active={groupFilter===g} onClick={()=>{setGroupFilter(g); setPage(0);}}>{g}</PillBtn>)}
        </div>
      </Card>

      {real ? (
        <Card padding={0} style={{overflow:"hidden"}}>
          <div style={{display:"grid", gridTemplateColumns:"40px 1.8fr 1fr 1.4fr 60px 60px 80px 90px", padding:"12px 18px", borderBottom:"1px solid rgba(255,255,255,0.06)", fontSize:10, fontFamily:"'JetBrains Mono', monospace", color:"#8b8fa3", letterSpacing:1.5, textTransform:"uppercase"}}>
            <div>#</div><div>Título / archivo</div><div>Artista</div><div>Crate</div><div>BPM</div><div>Key</div><div>Dur</div><div>Match</div>
          </div>
          {pageRows.map((r,i) => {
            const grp = (r.group || (r.crate||"").split("/")[0] || "—").trim() || "—";
            const ms = r.match_status;
            const matchKey = ms==="perfect"?"local": ms==="probable"?"probable": ms==="doubt"?"dudoso": ms==="duplicate"?"duplicado":"falta";
            const bpm = r.meta_bpm || "";
            const key = r.meta_key || "";
            const dur = r.duration_seconds ? `${Math.floor(r.duration_seconds/60)}:${String(Math.round(r.duration_seconds%60)).padStart(2,"0")}` : "";
            const title = r.meta_title || (r.filename||"").replace(/\.[^.]+$/,"");
            const artist = r.meta_artist || "—";
            return (
              <div key={i} style={{display:"grid", gridTemplateColumns:"40px 1.8fr 1fr 1.4fr 60px 60px 80px 90px", padding:"12px 18px", borderTop:"1px solid rgba(255,255,255,0.04)", alignItems:"center", fontSize:13}}>
                <div style={{fontFamily:"'JetBrains Mono', monospace", fontSize:11, color:"#8b8fa3"}}>{String(page*PAGE + i + 1).padStart(5,"0")}</div>
                <div style={{minWidth:0}}>
                  <div style={{color:"#f4f5f8", fontWeight:500, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{title}</div>
                  <div style={{fontSize:10.5, color:"#5a5d70", fontFamily:"'JetBrains Mono', monospace", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{r.filename}</div>
                </div>
                <div style={{color:"#cfd1d9", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{artist}</div>
                <div style={{color:"#8b8fa3", fontSize:11.5, fontFamily:"'JetBrains Mono', monospace", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}} title={r.crate}>{r.crate}</div>
                <div style={{fontFamily:"'JetBrains Mono', monospace", color: bpm?"#22e1ff":"#5a5d70", fontSize:12}}>{bpm || "—"}</div>
                <div style={{fontFamily:"'JetBrains Mono', monospace", color: key?"#ffb84d":"#5a5d70", fontSize:12}}>{key || "—"}</div>
                <div style={{fontFamily:"'JetBrains Mono', monospace", color: dur?"#cfd1d9":"#5a5d70", fontSize:12}}>{dur || "—"}</div>
                <MatchDot match={matchKey}/>
              </div>
            );
          })}
          {/* pagination */}
          <div style={{padding:"14px 18px", background:"rgba(255,255,255,0.02)", display:"flex", justifyContent:"space-between", alignItems:"center", borderTop:"1px solid rgba(255,255,255,0.06)"}}>
            <div style={{fontFamily:"'JetBrains Mono', monospace", fontSize:11.5, color:"#8b8fa3"}}>
              {page*PAGE+1}–{Math.min((page+1)*PAGE, totalReal)} de {totalReal.toLocaleString("es-CL")}
              {q && ` · filtrado de ${real.totals.seratoTracks.toLocaleString("es-CL")} totales`}
            </div>
            <div style={{display:"flex", gap:6}}>
              <Btn size="sm" variant="ghost" disabled={page===0} onClick={()=>setPage(p=>Math.max(0,p-1))}>← Anterior</Btn>
              <Btn size="sm" variant="ghost" disabled={(page+1)*PAGE >= totalReal} onClick={()=>setPage(p=>p+1)}>Siguiente →</Btn>
            </div>
          </div>
        </Card>
      ) : (
        <Card padding={0} style={{overflow:"hidden"}}>
          <div style={{display:"grid", gridTemplateColumns:"40px 2fr 1fr 1.5fr 1fr 70px 70px", padding:"12px 18px", borderBottom:"1px solid rgba(255,255,255,0.06)", fontSize:10, fontFamily:"'JetBrains Mono', monospace", color:"#8b8fa3", letterSpacing:1.5, textTransform:"uppercase"}}>
            <div>#</div><div>Archivo / tema</div><div>Artista</div><div>Crate real</div><div>Grupo</div><div>Ext</div><div>Pos</div>
          </div>
          {filteredSample.map((t,i)=>(
            <div key={i} style={{display:"grid", gridTemplateColumns:"40px 2fr 1fr 1.5fr 1fr 70px 70px", padding:"14px 18px", borderTop:"1px solid rgba(255,255,255,0.04)", alignItems:"center", fontSize:13}}>
              <div style={{fontFamily:"'JetBrains Mono', monospace", fontSize:11, color:"#8b8fa3"}}>{String(i+1).padStart(2,"0")}</div>
              <div style={{minWidth:0}}>
                <div style={{color:"#f4f5f8", fontWeight:500, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{t.title}</div>
                <div style={{fontSize:10.5, color:"#5a5d70", fontFamily:"'JetBrains Mono', monospace", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{t.filename}</div>

<script type="text/babel" data-presets="env,react">
// NANOOKEY — Pantalla 10: Restauración Serato
// Guarda snapshots históricos de crates para recuperación de emergencia

const { useState: useStateR, useEffect: useEffectR } = React;

const RESTORE_KEY = "NK_CRATE_SNAPSHOTS";

function loadSnapshots() {
  try {
    const raw = localStorage.getItem(RESTORE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}

function saveSnapshotsToStorage(snaps) {
  try {
    const limited = snaps.slice(0, 20);
    localStorage.setItem(RESTORE_KEY, JSON.stringify(limited));
  } catch(e) {
    try {
      const lite = snaps.slice(0, 8).map(s => ({...s, sampleTracks: (s.sampleTracks||[]).slice(0,30)}));
      localStorage.setItem(RESTORE_KEY, JSON.stringify(lite));
    } catch(e2) { /* quota exceeded */ }
  }
}

function exportBlob(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ---------- Restore Field helpers (self-contained) ----------
const RField = ({ label, children }) => (
  <div style={{ marginBottom: 12 }}>
    <div style={{ fontSize: 11, fontFamily: "'JetBrains Mono', monospace", color: "#8b8fa3", letterSpacing: 1.2, textTransform: "uppercase", marginBottom: 6 }}>{label}</div>
    {children}
  </div>
);
const RInput = ({ value, onChange, placeholder = "" }) => (
  <input value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder}
    style={{ width: "100%", padding: "10px 12px", borderRadius: 10, background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.10)", color: "#f4f5f8", fontSize: 14, outline: "none", fontFamily: "inherit", boxSizing: "border-box" }}
    onFocus={e => e.target.style.border = "1px solid rgba(34,225,255,0.5)"}
    onBlur={e => e.target.style.border = "1px solid rgba(255,255,255,0.10)"} />
);
const RTextarea = ({ value, onChange, rows = 2 }) => (
  <textarea value={value} rows={rows} onChange={e => onChange(e.target.value)}
    style={{ width: "100%", padding: "10px 12px", borderRadius: 10, background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.10)", color: "#f4f5f8", fontSize: 14, outline: "none", resize: "vertical", fontFamily: "inherit", boxSizing: "border-box" }} />
);

// ---------- Main Screen ----------
function ScreenRestore() {
  const [snapshots, setSnapshots] = useStateR(() => loadSnapshots());
  const [selected, setSelected] = useStateR(null);
  const [showModal, setShowModal] = useStateR(false);
  const [snapName, setSnapName] = useStateR("");
  const [snapNote, setSnapNote] = useStateR("");
  const real = window.useNKReal ? window.useNKReal() : null;
  const D = window.NK_DATA;

  const doSave = () => {
    const src = real ? "scanner" : "seed_data";
    const snap = {
      id: "snap_" + Date.now(),
      name: snapName.trim() || ("Snapshot " + new Date().toLocaleString("es-CL")),
      note: snapNote.trim(),
      savedAt: new Date().toISOString(),
      source: src,
      stats: {
        seratoTracks: real ? real.totals.seratoTracks : D.realStats.uniqueTracks,
        crates:        real ? real.totals.crates        : D.realStats.crates,
        groups:        real ? real.crateGroups.length   : D.crateGroups.length,
        matchCounts:   real ? real.matchStatusCounts    : {},
      },
      crateGroups: real ? real.crateGroups : D.crateGroups,
      extensions:  real
        ? Object.entries(real.extensionCountsSerato || {}).map(([ext, count]) => ({ ext, count }))
        : D.extensions,
      sampleTracks: real ? (real.master || []).slice(0, 300) : D.sampleTracks,
    };
    const updated = [snap, ...snapshots];
    setSnapshots(updated);
    saveSnapshotsToStorage(updated);
    setShowModal(false); setSnapName(""); setSnapNote("");
    setSelected(snap.id);
  };

  const doDelete = (id) => {
    if (!confirm("¿Eliminar este snapshot? No se puede deshacer.")) return;
    const updated = snapshots.filter(s => s.id !== id);
    setSnapshots(updated); saveSnapshotsToStorage(updated);
    if (selected === id) setSelected(null);
  };

  const doExportJSON = (snap) => {
    exportBlob(JSON.stringify(snap, null, 2),
      "NANOOKEY_crates_" + snap.savedAt.slice(0,10) + "_" + snap.id.slice(-6) + ".json",
      "application/json");
  };

  const doExportCSV = (snap) => {
    const rows = [["grupo","entradas","unicos","crates","color"]];
    (snap.crateGroups || []).forEach(g => rows.push([g.name, g.entries, g.unique, g.crates, g.color || ""]));
    exportBlob(rows.map(r => r.map(v => `"${v}"`).join(",")).join("\n"),
      "NANOOKEY_crates_" + snap.savedAt.slice(0,10) + "_" + snap.id.slice(-6) + ".csv",

        </div>
        <Btn variant="primary" icon="download" onClick={() => setShowModal(true)}>Guardar snapshot ahora</Btn>

      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: 24, marginBottom: 20 }}>

          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: "#22e1ff", letterSpacing: 2, textTransform: "uppercase", marginBottom: 8 }}>10 — RESTAURACIÓN</div>

          <p style={{ color: "#8b8fa3", margin: "8px 0 0", fontSize: 14 }}>Historial de snapshots guardados localmente. Cada snapshot preserva la estructura completa de tus crates y grupos.</p>
        </div>
        <div style={{ display: "flex", gap: 10 }}>

        </div>
      </div>

      {/* Stats */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 16, marginBottom: 20 }}>
        <Card padding={20} style={{ overflow: "hidden" }}>
          <div style={{ position: "absolute", inset: 0, background: "radial-gradient(120% 80% at 0% 0%, rgba(255,58,168,0.15), transparent 60%)", pointerEvents: "none" }} />
          <div style={{ fontSize: 11, fontFamily: "'JetBrains Mono', monospace", color: "#8b8fa3", letterSpacing: 1.5, textTransform: "uppercase", position: "relative" }}>Snapshots guardados</div>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 38, fontWeight: 600, letterSpacing: -1.5, marginTop: 10, color: "#f4f5f8", position: "relative" }}>{snapshots.length}</div>
          <div style={{ fontSize: 12, color: "#a0a3b3", marginTop: 4, position: "relative" }}>en localStorage</div>
        </Card>
        <Card padding={20} style={{ overflow: "hidden" }}>
          <div style={{ position: "absolute", inset: 0, background: "radial-gradient(120% 80% at 0% 0%, rgba(34,225,255,0.12), transparent 60%)", pointerEvents: "none" }} />
          <div style={{ fontSize: 11, fontFamily: "'JetBrains Mono', monospace", color: "#8b8fa3", letterSpacing: 1.5, textTransform: "uppercase", position: "relative" }}>Último guardado</div>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 22, fontWeight: 600, letterSpacing: -0.5, marginTop: 10, color: "#f4f5f8", position: "relative" }}>{snapshots[0] ? new Date(snapshots[0].savedAt).toLocaleDateString("es-CL") : "—"}</div>
