<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>FRATV · Logo Ident Short</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fratv-aspectos.css">
<style>
  /* Valores por defecto. El runtime los sobrescribe; NUNCA escribir un hex más abajo. */
  :root {
    /* ===== Escala y áreas seguras — NO escribir px desnudos más abajo. =====
       Todo el paquete fue dibujado contra un ancho de 1920. --fr-u convierte
       esas medidas a la fracción de ancho que les corresponde, así el mismo
       archivo sirve en 16:9, 9:16, 1:1 y 4:5. En 16:9 el resultado es idéntico
       al diseño original; en vertical la gráfica pesa más, que es lo correcto
       para un teléfono. El runtime pone data-aspecto en :root. */
    --fr-u: calc(100vw / 1920);
    --safe-top: 5%;
    --safe-bottom: 5%;
    --safe-x: 5%;
    --safe-lower: 12%;   /* línea base del lower third y del ticker */
    --safe-flag: 5%;     /* esquina superior: mosca, badge, cuenta regresiva */

    --fr-accent: #B72A3A;
    --fr-on-accent: #F5F1E8;
    --fr-plate: rgba(16,11,24,.94);
    --fr-surface: #100B18;
    --fr-text: #F5F1E8;
    --fr-text-dim: rgba(245,241,232,.72);
    --fr-hairline: rgba(245,241,232,.18);
    --fr-radius-plate:calc(14 * var(--fr-u));
    --fr-radius-pill:calc(22 * var(--fr-u));
    --fr-radius-chip:calc(7 * var(--fr-u));
    --fr-font-display: 'Poppins', system-ui, sans-serif;
    --fr-font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --fr-font-wordmark: 'Arial Rounded MT Bold', 'Poppins', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100vw; height: 100vh; background: transparent; overflow: hidden; }

  .stage { position: relative; width: 100%; height: 100%; }

  /* Guías de área segura: solo con ?safe=1 */
  .safe { position: absolute; inset: 10%; border:1px dashed var(--fr-accent); opacity: 0; }
  :root[data-safe="1"] .safe { opacity: .55; }

  [hidden] { display: none !important; }


  .lockup { display: flex; align-items: center; gap:calc(30 * var(--fr-u)); }
  .lockup .sim { width: var(--sim); height: var(--sim); display: block; flex-shrink: 0; }
  /* Wordmark vectorizado: trazos, no texto. No depende de ninguna tipografía
     instalada. Proporciones de Arial Rounded MT Bold al cuerpo 165. */
  .wm-linea { display: block; width: calc(var(--wm) * 3.2103); height: calc(var(--wm) * 0.7885); }
  #word-fra { fill: var(--fr-text); }
  #word-tv  { fill: var(--fr-accent); }
  .wm-bajada { font-family: var(--fr-font-display); font-weight: 700;
               font-size: calc(var(--wm) * .193); letter-spacing: calc(var(--wm) * .115);
               color: var(--fr-accent); margin-top: calc(var(--wm) * .098); }

  .ident { position: absolute; inset: 0; display: grid; place-items: center;
           animation: identOut 900ms linear forwards; }
  .lockup svg g, .lockup .wm > div { transform-box: fill-box; transform-origin: center; }
  @keyframes identOut { 0%,74% { opacity: 1 } 100% { opacity: 0 } }

  /* Recorte de la entrada 1d (Asentado): la que mejor aguanta 0,9 s. */
  #icon-tile { animation: settle 900ms cubic-bezier(.22,.9,.24,1) both; }
  #icon-f    { animation: settleF 900ms cubic-bezier(.22,.9,.24,1) both; animation-delay: 40ms; }
  #icon-play,
  #icon-tv   { animation: settleP 900ms cubic-bezier(.22,.9,.24,1) both; animation-delay: 80ms; }
  .wm-linea  { animation: settle 900ms cubic-bezier(.22,.9,.24,1) both; animation-delay: 150ms; }
  .wm-bajada   { animation: settle 900ms cubic-bezier(.22,.9,.24,1) both; animation-delay: 200ms; }
  @keyframes settle  { 0% { opacity: 0; transform: scale(.94) } 27%,100% { opacity: 1; transform: scale(1) } }
  @keyframes settleF { 0% { opacity: 0; transform: scale(.84) } 27%,100% { opacity: 1; transform: scale(1) } }
  @keyframes settleP { 0% { opacity: 0; transform: scale(.82) } 27%,100% { opacity: 1; transform: scale(1) } }
</style>
</head>
