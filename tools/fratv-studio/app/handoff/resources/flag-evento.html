<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>FRATV · Mosca con evento</title>
<link rel="stylesheet" href="fratv-aspectos.css">
<style>
  /* Valores por defecto. El runtime los sobrescribe; NUNCA escribir un hex más abajo. */
  :root {
    /* ===== Escala y áreas seguras — NO escribir px desnudos más abajo. =====
       Todo el paquete fue dibujado contra un ancho de 1920. --fr-u convierte
       esas medidas a la fracción de ancho que les corresponde, así el mismo
       archivo sirve en 16:9, 9:16, 1:1 y 4:5. En 16:9 el resultado es idéntico
       al diseño original; en vertical la gráfica pesa más, que es lo correcto
       para un teléfono. El runtime pone data-aspecto en :root. */
    --fr-u: calc(100vw / 1920);
    --safe-top: 5%;
    --safe-bottom: 5%;
    --safe-x: 5%;
    --safe-lower: 12%;   /* línea base del lower third y del ticker */
    --safe-flag: 5%;     /* esquina superior: mosca, badge, cuenta regresiva */

    --fr-accent: #B72A3A;
    --fr-on-accent: #F5F1E8;
    --fr-surface: #100B18;
    --fr-text: #F5F1E8;
    --fr-hairline: rgba(245,241,232,.18);
    --fr-evento-alto:calc(76 * var(--fr-u));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100vw; height: 100vh; background: transparent; overflow: hidden; }
  .stage { position: relative; width: 100%; height: 100%; }
  .safe { position: absolute; inset: var(--safe-top) var(--safe-x) var(--safe-bottom); border:1px dashed var(--fr-accent); opacity: 0; }
  :root[data-safe="1"] .safe { opacity: .55; }
  [hidden] { display: none !important; }

  /* Mosca de coproducción: la marca del canal manda, la del evento acompaña. */
  .mosca { position: absolute; right: var(--safe-x); top: var(--safe-flag); display: flex; align-items: center; gap:calc(26 * var(--fr-u)); }
  .mosca .fratv { width:calc(170 * var(--fr-u)); display: block; }
  .raya { width:1px; height:calc(58 * var(--fr-u)); background: var(--fr-hairline); }
  .evento { height: var(--fr-evento-alto); display: block; }
  .evento img { height: 100%; width: auto; display: block; }

  .trazo { stroke: var(--fr-text); fill: none; }
  .solido { fill: var(--fr-text); stroke: none; }
  .tv { stroke: var(--fr-accent); fill: none; }
</style>
</head>
<body>
<div class="stage">
  <div class="safe"></div>

  <div class="mosca">
    <svg class="fratv" viewBox="56 162 430 276" aria-label="FRATV">
      <g id="icon-f" transform="translate(60 166.5) scale(1.3) translate(-101.25 -197.25)">
        <g transform="translate(90 195) scale(.75)">
          <path class="trazo" d="M42 250V30H204M42 138H174"
                stroke-width="54" stroke-linecap="round" stroke-linejoin="round"></path>
        </g>
      </g>
      <g id="icon-play" transform="translate(21 0)">
        <g transform="translate(90 195) scale(.75)">
          <path class="solido" d="M268 17Q252 7 252 30V250Q252 273 270 263L484 153Q504 140 484 127Z"></path>
        </g>
      </g>
      <g id="icon-tv" transform="translate(21 0)" stroke-width="16"
         stroke-linecap="round" stroke-linejoin="round">
        <g transform="translate(90 195) scale(.75)">
          <path class="tv" d="M301 112H347M324 112V170"></path>
          <path class="tv" d="M354 114L370 167L388 114"></path>
        </g>
      </g>
    </svg>

    <span class="raya"></span>
    <span class="evento"><img id="logo" alt=""></span>
  </div>
</div>

<script src="fratv-runtime.js"></script>
<script>
  var q = new URLSearchParams(location.search);

  /* El logo del evento se pasa por URL. Por defecto, el de Fraternidad. */
  var img = document.getElementById('logo');
  img.src = q.get('logo') || '../assets/eventos/fraternidad-horizontal-blanco.png';
  img.onerror = function () { document.querySelector('.evento').hidden = true;
                              document.querySelector('.raya').hidden = true; };

  /* ?alto= se da en medidas de diseño (contra 1920) y pasa por la unidad fluida. */
  if (q.get('alto')) document.documentElement.style.setProperty('--fr-evento-alto', 'calc(' + parseFloat(q.get('alto')) + ' * var(--fr-u))');

  window.FRATVRuntime.create({ id: 'flag-evento', durationMs: 0, loop: true, alpha: true });
</script>
</body>
</html>
