<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>FRATV · Título de programa</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fratv-aspectos.css">
<style>
  /* Valores por defecto. El runtime los sobrescribe; NUNCA escribir un hex más abajo. */
  :root {
    /* ===== Escala y áreas seguras — NO escribir px desnudos más abajo. =====
       Todo el paquete fue dibujado contra un ancho de 1920. --fr-u convierte
       esas medidas a la fracción de ancho que les corresponde, así el mismo
       archivo sirve en 16:9, 9:16, 1:1 y 4:5. En 16:9 el resultado es idéntico
       al diseño original; en vertical la gráfica pesa más, que es lo correcto
       para un teléfono. El runtime pone data-aspecto en :root. */
    --fr-u: calc(100vw / 1920);
    --safe-top: 5%;
    --safe-bottom: 5%;
    --safe-x: 5%;
    --safe-lower: 12%;   /* línea base del lower third y del ticker */
    --safe-flag: 5%;     /* esquina superior: mosca, badge, cuenta regresiva */

    --fr-accent: #B72A3A;
    --fr-on-accent: #F5F1E8;
    --fr-plate: rgba(16,11,24,.94);
    --fr-surface: #100B18;
    --fr-text: #F5F1E8;
    --fr-text-dim: rgba(245,241,232,.72);
    --fr-hairline: rgba(245,241,232,.18);
    --fr-radius-plate:calc(14 * var(--fr-u));
    --fr-radius-pill:calc(22 * var(--fr-u));
    --fr-radius-chip:calc(7 * var(--fr-u));
    --fr-font-display: 'Poppins', system-ui, sans-serif;
    --fr-font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --fr-font-wordmark: 'Arial Rounded MT Bold', 'Poppins', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100vw; height: 100vh; background: transparent; overflow: hidden; }

  .stage { position: relative; width: 100%; height: 100%; }

  /* Guías de área segura: solo con ?safe=1 */
  .safe { position: absolute; inset: 10%; border:1px dashed var(--fr-accent); opacity: 0; }
  :root[data-safe="1"] .safe { opacity: .55; }

  [hidden] { display: none !important; }


  .titulo { position: absolute; left: calc(var(--safe-x) + 3%); bottom: calc(var(--safe-lower) + 2%); max-width: 62%; }
  .chip { display: inline-block; background: var(--fr-accent); color: var(--fr-on-accent);
          border-radius: var(--fr-radius-chip); padding:calc(14 * var(--fr-u)) calc(28 * var(--fr-u));
          font-family: var(--fr-font-mono); font-weight: 700; font-size:calc(22 * var(--fr-u)); letter-spacing: .18em;
          animation: sube 8000ms cubic-bezier(.22,.9,.24,1) both; }
  .t { font-family: var(--fr-font-display); font-weight: 700; font-size:calc(110 * var(--fr-u));
       line-height: 1.04; letter-spacing: -.015em; color: var(--fr-text); margin-top:calc(33 * var(--fr-u));
       white-space: pre-line;
       animation: sube 8000ms cubic-bezier(.22,.9,.24,1) both; animation-delay: 120ms; }
  .regla { height:calc(9 * var(--fr-u)); width: 38%; border-radius:calc(5 * var(--fr-u)); background: var(--fr-accent); margin-top:calc(38 * var(--fr-u));
           transform-origin: left center;
           animation: barre 8000ms cubic-bezier(.22,.9,.24,1) both; animation-delay: 240ms; }
  .meta { font-family: var(--fr-font-mono); font-size:calc(25 * var(--fr-u)); letter-spacing: .2em;
          color: var(--fr-text-dim); margin-top:calc(33 * var(--fr-u));
          animation: sube 8000ms cubic-bezier(.22,.9,.24,1) both; animation-delay: 360ms; }
  @keyframes sube  { 0% { opacity: 0; transform:translateY(calc(33 * var(--fr-u))) } 8%,88% { opacity: 1; transform: translateY(0) } 100% { opacity: 0 } }
  @keyframes barre { 0% { transform: scaleX(0) } 10%,88% { transform: scaleX(1) } 100% { opacity: 0 } }
</style>
</head>
<body>
<div class="stage">
  <div class="safe"></div>
  <div class="titulo">
    <span class="chip" data-field="kicker">NUEVO EPISODIO</span>
    <div class="t" data-field="title">HISTORIAS
DE BARRIO</div>
    <div class="regla"></div>
    <div class="meta" data-field="meta">JUEVES · 21:00 · @FRATV</div>
  </div>
</div>

<script src="fratv-runtime.js"></script>
<script>
window.FRATVRuntime.create({ id: 'program-title', durationMs: 8000, loop: false, alpha: true });
</script>
</body>
</html>
