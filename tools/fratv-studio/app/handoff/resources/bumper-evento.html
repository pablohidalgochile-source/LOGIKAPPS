<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>FRATV · Cortinilla de evento</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fratv-aspectos.css">
<style>
  /* Valores por defecto. El runtime los sobrescribe; NUNCA escribir un hex más abajo. */
  :root {
    /* ===== Escala y áreas seguras — NO escribir px desnudos más abajo. =====
       Todo el paquete fue dibujado contra un ancho de 1920. --fr-u convierte
       esas medidas a la fracción de ancho que les corresponde, así el mismo
       archivo sirve en 16:9, 9:16, 1:1 y 4:5. En 16:9 el resultado es idéntico
       al diseño original; en vertical la gráfica pesa más, que es lo correcto
       para un teléfono. El runtime pone data-aspecto en :root. */
    --fr-u: calc(100vw / 1920);
    --safe-top: 5%;
    --safe-bottom: 5%;
    --safe-x: 5%;
    --safe-lower: 12%;   /* línea base del lower third y del ticker */
    --safe-flag: 5%;     /* esquina superior: mosca, badge, cuenta regresiva */

    --fr-accent: #B72A3A;
    --fr-on-accent: #F5F1E8;
    --fr-surface: #100B18;
    --fr-text: #F5F1E8;
    --fr-text-dim: rgba(245,241,232,.72);
    --fr-hairline: rgba(245,241,232,.18);
    --fr-font-display: 'Poppins', system-ui, sans-serif;
    --fr-font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --fr-evento-alto:calc(300 * var(--fr-u));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100vw; height: 100vh; background: var(--fr-surface); overflow: hidden; }
  .stage { position: relative; width: 100%; height: 100%; }
  .safe { position: absolute; inset: 10%; border:1px dashed var(--fr-accent); opacity: 0; }
  :root[data-safe="1"] .safe { opacity: .55; }
  [hidden] { display: none !important; }

  .filete { position: absolute; left: 0; right: 0; top: 0; height:calc(12 * var(--fr-u)); background: var(--fr-accent); }

  .centro { position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 0; }

  .presenta { font-family: var(--fr-font-mono); font-weight: 700; font-size:calc(24 * var(--fr-u));
              letter-spacing: .34em; color: var(--fr-accent); margin-bottom:calc(46 * var(--fr-u));
              animation: entra 7000ms ease infinite both; }

  .logo { height: var(--fr-evento-alto); animation: entra 7000ms ease infinite both; animation-delay: 120ms; }
  .logo img { height: 100%; width: auto; display: block; }

  .titulo { font-family: var(--fr-font-display); font-weight: 700; font-size:calc(62 * var(--fr-u));
            line-height: 1.1; color: var(--fr-text); margin-top:calc(54 * var(--fr-u)); text-align: center;
            animation: entra 7000ms ease infinite both; animation-delay: 240ms; }
  .sub { font-family: var(--fr-font-mono); font-size:calc(25 * var(--fr-u)); letter-spacing: .28em;
         color: var(--fr-text-dim); margin-top:calc(26 * var(--fr-u)); text-align: center;
         animation: entra 7000ms ease infinite both; animation-delay: 360ms; }

  /* La firma del canal, discreta: el evento manda. */
  .canal { position: absolute; right: var(--safe-x); bottom: calc(var(--safe-bottom) + 1%); display: flex; align-items: center; gap:calc(18 * var(--fr-u));
           animation: entra 7000ms ease infinite both; animation-delay: 480ms; }
  .canal svg { width:calc(118 * var(--fr-u)); display: block; }
  .canal .et { font-family: var(--fr-font-mono); font-size:calc(17 * var(--fr-u)); letter-spacing: .24em;
               color: var(--fr-text-dim); }
  .trazo { stroke: var(--fr-text); fill: none; }
  .solido { fill: var(--fr-text); }
  .tv { stroke: var(--fr-accent); fill: none; }

  @keyframes entra { 0% { opacity: 0; transform:translateY(calc(30 * var(--fr-u))) } 9%,92% { opacity: 1; transform: translateY(0) } 100% { opacity: 0 } }
</style>
</head>
<body>
<div class="stage">
  <div class="safe"></div>
  <div class="filete"></div>

  <div class="centro">
    <div class="presenta" data-field="presenta">FRATV PRESENTA</div>
    <div class="logo"><img id="logo" alt=""></div>
    <div class="titulo" data-field="titulo">CASTING 2026</div>
    <div class="sub" data-field="subtitulo">CAMPUS CENTRAL · 21:00</div>
  </div>

  <div class="canal">
    <span class="et">TRANSMITE</span>
    <svg viewBox="56 162 430 276" aria-label="FRATV">
      <g id="icon-f" transform="translate(60 166.5) scale(1.3) translate(-101.25 -197.25)">
        <g transform="translate(90 195) scale(.75)">
          <path class="trazo" d="M42 250V30H204M42 138H174" stroke-width="54"
                stroke-linecap="round" stroke-linejoin="round"></path>
        </g>
      </g>
      <g id="icon-play" transform="translate(21 0)">
        <g transform="translate(90 195) scale(.75)">
          <path class="solido" d="M268 17Q252 7 252 30V250Q252 273 270 263L484 153Q504 140 484 127Z"></path>
        </g>
      </g>
      <g id="icon-tv" transform="translate(21 0)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
        <g transform="translate(90 195) scale(.75)">
          <path class="tv" d="M301 112H347M324 112V170"></path>
          <path class="tv" d="M354 114L370 167L388 114"></path>
        </g>
      </g>
    </svg>
  </div>
</div>

<script src="fratv-runtime.js"></script>
<script>
  var q = new URLSearchParams(location.search);
  var img = document.getElementById('logo');
  img.src = q.get('logo') || '../assets/eventos/fraternidad-insignia.png';
  img.onerror = function () { document.querySelector('.logo').hidden = true; };
  /* ?alto= se da en medidas de diseño (contra 1920) y pasa por la unidad fluida. */
  if (q.get('alto')) document.documentElement.style.setProperty('--fr-evento-alto', 'calc(' + parseFloat(q.get('alto')) + ' * var(--fr-u))');

  window.FRATVRuntime.create({ id: 'bumper-evento', durationMs: 7000, loop: true, alpha: false });
</script>
</body>
</html>
