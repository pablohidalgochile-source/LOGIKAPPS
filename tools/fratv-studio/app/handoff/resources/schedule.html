<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>FRATV · A continuación y programación</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fratv-aspectos.css">
<style>
  /* Valores por defecto. El runtime los sobrescribe; NUNCA escribir un hex más abajo. */
  :root {
    /* ===== Escala y áreas seguras — NO escribir px desnudos más abajo. =====
       Todo el paquete fue dibujado contra un ancho de 1920. --fr-u convierte
       esas medidas a la fracción de ancho que les corresponde, así el mismo
       archivo sirve en 16:9, 9:16, 1:1 y 4:5. En 16:9 el resultado es idéntico
       al diseño original; en vertical la gráfica pesa más, que es lo correcto
       para un teléfono. El runtime pone data-aspecto en :root. */
    --fr-u: calc(100vw / 1920);
    --safe-top: 5%;
    --safe-bottom: 5%;
    --safe-x: 5%;
    --safe-lower: 12%;   /* línea base del lower third y del ticker */
    --safe-flag: 5%;     /* esquina superior: mosca, badge, cuenta regresiva */

    --fr-accent: #B72A3A;
    --fr-on-accent: #F5F1E8;
    --fr-plate: rgba(16,11,24,.94);
    --fr-surface: #100B18;
    --fr-text: #F5F1E8;
    --fr-text-dim: rgba(245,241,232,.72);
    --fr-hairline: rgba(245,241,232,.18);
    --fr-radius-plate:calc(14 * var(--fr-u));
    --fr-radius-pill:calc(22 * var(--fr-u));
    --fr-radius-chip:calc(7 * var(--fr-u));
    --fr-font-display: 'Poppins', system-ui, sans-serif;
    --fr-font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --fr-font-wordmark: 'Arial Rounded MT Bold', 'Poppins', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100vw; height: 100vh; background: transparent; overflow: hidden; }

  .stage { position: relative; width: 100%; height: 100%; }

  /* Guías de área segura: solo con ?safe=1 */
  .safe { position: absolute; inset: 10%; border:1px dashed var(--fr-accent); opacity: 0; }
  :root[data-safe="1"] .safe { opacity: .55; }

  [hidden] { display: none !important; }


  .prog { position: absolute; inset: calc(var(--safe-top) + 1%) calc(var(--safe-x) + 2%); display: flex; flex-direction: column; }
  .cab { display: flex; align-items: center; gap:calc(28 * var(--fr-u));
         animation: sube 8000ms cubic-bezier(.22,.9,.24,1) both; }
  .cab .chip { background: var(--fr-accent); color: var(--fr-on-accent);
               border-radius: var(--fr-radius-chip); padding:calc(14 * var(--fr-u)) calc(28 * var(--fr-u));
               font-family: var(--fr-font-mono); font-weight: 700; font-size:calc(22 * var(--fr-u)); letter-spacing: .18em; }
  .cab .linea { flex: 1; height:1px; background: var(--fr-hairline); }
  .cab .dia { font-family: var(--fr-font-mono); font-weight: 700; font-size:calc(22 * var(--fr-u));
              letter-spacing: .16em; color: var(--fr-text-dim); }
  .filas { display: flex; flex-direction: column; gap:calc(21 * var(--fr-u)); margin-top:calc(42 * var(--fr-u)); }
  .fila { display: flex; align-items: center; gap:calc(33 * var(--fr-u)); border-radius:calc(19 * var(--fr-u));
          padding:calc(26 * var(--fr-u)) calc(35 * var(--fr-u)); background: var(--fr-plate);
          animation: sube 8000ms cubic-bezier(.22,.9,.24,1) both; }
  .fila:first-child { border-left:calc(7 * var(--fr-u)) solid var(--fr-accent); }
  .fila:nth-child(2) { animation-delay: 120ms; }
  .fila:nth-child(3) { animation-delay: 240ms; }
  .fila:nth-child(4) { animation-delay: 360ms; }
  .fila:nth-child(5) { animation-delay: 480ms; }
  .hora { font-family: var(--fr-font-mono); font-weight: 700; font-size:calc(35 * var(--fr-u));
          width:calc(122 * var(--fr-u)); flex-shrink: 0; color: var(--fr-text); font-variant-numeric: tabular-nums; }
  .nom { flex: 1; font-family: var(--fr-font-display); font-weight: 600; font-size:calc(38 * var(--fr-u));
         color: var(--fr-text); }
  .tag { font-family: var(--fr-font-mono); font-weight: 700; font-size:calc(21 * var(--fr-u)); letter-spacing: .14em;
         color: var(--fr-accent); }
  @keyframes sube { 0% { opacity: 0; transform:translateY(calc(26 * var(--fr-u))) } 8%,88% { opacity: 1; transform: translateY(0) } 100% { opacity: 0 } }
</style>
</head>
<body>
<div class="stage">
  <div class="safe"></div>
  <div class="prog">
    <div class="cab">
      <span class="chip" data-field="label">A CONTINUACIÓN</span>
      <span class="linea"></span>
      <span class="dia" data-field="dayLabel">HOY</span>
    </div>
    <div class="filas" id="filas"></div>
  </div>
</div>

<script src="fratv-runtime.js"></script>
<script>
var api = window.FRATVRuntime.create({ id: 'schedule', durationMs: 8000, loop: false, alpha: true });

/* Filas: hasta 5. Se aceptan por ?rows=21:00|TITULO|EN VIVO;22:00|OTRO|ESTRENO */
var POR_DEFECTO = [
  ['21:00', 'HISTORIAS DE BARRIO', 'EN VIVO'],
  ['22:00', 'ENTREVISTA DEL JUEVES', 'ESTRENO'],
  ['23:00', 'RESUMEN DE LA SEMANA', 'REPETICI\u00d3N']
];
var q = new URLSearchParams(location.search);
var datos = q.get('rows')
  ? q.get('rows').split(';').map(function (r) { return r.split('|'); })
  : POR_DEFECTO;

var cont = document.getElementById('filas');
datos.slice(0, 5).forEach(function (r) {
  var d = document.createElement('div');
  d.className = 'fila';
  d.innerHTML = '<span class="hora"></span><span class="nom"></span><span class="tag"></span>';
  d.children[0].textContent = r[0] || '';
  d.children[1].textContent = r[1] || '';
  d.children[2].textContent = r[2] || '';
  cont.appendChild(d);
});
</script>
</body>
</html>
