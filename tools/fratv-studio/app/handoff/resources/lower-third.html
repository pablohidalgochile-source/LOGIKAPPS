<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>FRATV · Lower Third</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fratv-aspectos.css">
<style>
  /* Valores por defecto. El runtime los sobrescribe; NUNCA escribir un hex más abajo. */
  :root {
    /* ===== Escala y áreas seguras — NO escribir px desnudos más abajo. =====
       Todo el paquete fue dibujado contra un ancho de 1920. --fr-u convierte
       esas medidas a la fracción de ancho que les corresponde, así el mismo
       archivo sirve en 16:9, 9:16, 1:1 y 4:5. En 16:9 el resultado es idéntico
       al diseño original; en vertical la gráfica pesa más, que es lo correcto
       para un teléfono. El runtime pone data-aspecto en :root. */
    --fr-u: calc(100vw / 1920);
    --safe-top: 5%;
    --safe-bottom: 5%;
    --safe-x: 5%;
    --safe-lower: 12%;   /* línea base del lower third y del ticker */
    --safe-flag: 5%;     /* esquina superior: mosca, badge, cuenta regresiva */

    --fr-accent: #B72A3A;
    --fr-on-accent: #F5F1E8;
    --fr-plate: rgba(16,11,24,.94);
    --fr-text: #F5F1E8;
    --fr-text-dim: rgba(245,241,232,.72);
    --fr-radius-plate:calc(14 * var(--fr-u));
    --fr-font-display: 'Poppins', system-ui, sans-serif;
    --fr-font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --fr-dur: 9000ms;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100vw; height: 100vh; background: transparent; overflow: hidden; }

  .stage { position: relative; width: 100%; height: 100%; }

  /* Guías de área segura: solo con ?safe=1 */
  .safe { position: absolute; inset: var(--safe-top) var(--safe-x) var(--safe-bottom); border:1px dashed var(--fr-accent); opacity: 0; }
  :root[data-safe="1"] .safe { opacity: .55; }

  .lt {
    position: absolute; left: var(--safe-x); bottom: var(--safe-lower);
    display: flex; align-items: stretch;
    border-radius: var(--fr-radius-plate); overflow: hidden;
    animation: wipe var(--fr-dur) cubic-bezier(.3,0,.2,1) forwards;
  }
  .mark { background: var(--fr-accent); display: flex; align-items: center; padding:0 calc(30 * var(--fr-u)); }
  .mark svg { width:calc(76 * var(--fr-u)); display: block; }
  .mark path { fill: var(--fr-on-accent); }
  .mark .f { fill: none; stroke: var(--fr-on-accent); stroke-width: 54; stroke-linecap: round; stroke-linejoin: round; }

  .plate { background: var(--fr-plate); padding:calc(26 * var(--fr-u)) calc(54 * var(--fr-u)) calc(30 * var(--fr-u)); }
  .name {
    font-family: var(--fr-font-display); font-weight: 600; font-size:calc(54 * var(--fr-u));
    letter-spacing: -.01em; line-height: 1; color: var(--fr-text);
    animation: rise var(--fr-dur) ease forwards;
  }
  .role {
    font-family: var(--fr-font-mono); font-weight: 400; font-size:calc(19 * var(--fr-u));
    letter-spacing: .2em; color: var(--fr-text-dim); margin-top:calc(17 * var(--fr-u));
    animation: rise var(--fr-dur) ease forwards; animation-delay: 0ms;
  }
  .topic {
    position: absolute; right: var(--safe-x); bottom: var(--safe-lower);
    display: flex; align-items: stretch; border-radius:calc(12 * var(--fr-u)); overflow: hidden;
    animation: wipeR var(--fr-dur) cubic-bezier(.3,0,.2,1) forwards;
  }
  .topic-tag {
    background: var(--fr-accent); color: var(--fr-on-accent);
    font-family: var(--fr-font-mono); font-weight: 700; font-size:calc(15 * var(--fr-u));
    letter-spacing: .16em; display: flex; align-items: center; padding:0 calc(20 * var(--fr-u));
  }
  .topic-text {
    background: var(--fr-plate); color: var(--fr-text);
    font-family: var(--fr-font-display); font-weight: 500; font-size:calc(25 * var(--fr-u));
    display: flex; align-items: center; padding:calc(18 * var(--fr-u)) calc(32 * var(--fr-u));
  }

  /* ===== Composición vertical =====
     A 1080 de ancho la placa y el chip de tema no caben en la misma línea:
     se pisarían. En 9:16 (y en 4:5, que también es angosto) el chip se apila
     bajo la placa, alineado al mismo borde izquierdo, y entra desde la
     izquierda como la placa en vez de desde la derecha. */
  :root[data-aspecto="9:16"] .topic,
  :root[data-aspecto="4:5"] .topic {
    right: auto; left: var(--safe-x);
    bottom: calc(var(--safe-lower) - 9%);
    animation-name: wipe;
  }

  [hidden] { display: none !important; }

  @keyframes wipe  { 0%,4% { clip-path: inset(0 100% 0 0) } 14%,84% { clip-path: inset(0 0 0 0) } 94%,100% { clip-path: inset(0 0 0 100%) } }
  @keyframes wipeR { 0%,16% { clip-path: inset(0 0 0 100%) } 26%,84% { clip-path: inset(0 0 0 0) } 94%,100% { clip-path: inset(0 100% 0 0) } }
  @keyframes rise  { 0%,12% { opacity: 0; transform:translateY(calc(12 * var(--fr-u))) } 24%,82% { opacity: 1; transform: translateY(0) } 90%,100% { opacity: 0 } }
</style>
</head>
<body>
<div class="stage">
  <div class="safe"></div>

  <div class="lt">
    <div class="mark">
      <!-- Símbolo sin contenedor. Ids de capa del master: NO renombrar. -->
      <svg viewBox="56 162 430 276" aria-label="FRATV">
        <g id="icon-f" transform="translate(60 166.5) scale(1.3) translate(-101.25 -197.25)">
          <g transform="translate(90 195) scale(.75)">
            <path class="f" d="M42 250V30H204M42 138H174"></path>
          </g>
        </g>
        <g id="icon-play" transform="translate(21 0)">
          <g transform="translate(90 195) scale(.75)">
            <path d="M268 17Q252 7 252 30V250Q252 273 270 263L484 153Q504 140 484 127Z"></path>
          </g>
        </g>
      </svg>
    </div>
    <div class="plate">
      <div class="name" data-field="name">PABLO HIDALGO</div>
      <div class="role" data-field="role">CONDUCTOR · FRATV</div>
    </div>
  </div>

  <div class="topic">
    <div class="topic-tag" data-field="topicLabel">TEMA</div>
    <div class="topic-text" data-field="topic" hidden></div>
  </div>
</div>

<script src="fratv-runtime.js"></script>
<script>
  var api = window.FRATVRuntime.create(
    { id: 'lower-third', durationMs: 9000, loop: false, alpha: true },
    { onSeek: function () {} }
  );
  /* La etiqueta de tema solo aparece si hay texto. */
  var topic = document.querySelector('[data-field="topic"]');
  var wrap  = document.querySelector('.topic');
  new MutationObserver(function () {
    wrap.hidden = topic.hidden || !topic.textContent.trim();
  }).observe(topic, { childList: true, attributes: true, subtree: true });
  wrap.hidden = !topic.textContent.trim();
</script>
</body>
</html>
