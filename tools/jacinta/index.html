<script>
/* Si la dirección termina sin «/» (por ejemplo …/jacinta), se la agrega: así las rutas
   relativas (./img, ./carta.json) funcionan igual en una subcarpeta y en la raíz. */
(function(){ try{ var l=location;
  if(/^https?:$/.test(l.protocol)){ var p=l.pathname, u=p.split('/').pop();
    if(p.length>1 && !/\/$/.test(p) && u.indexOf('.')<0) l.replace(p+'/'+l.search+l.hash); }
}catch(e){} })();
</script>

a{color:var(--acento)}

/* «hoy», «mañana» o «sábado 24 de octubre» */
function fechaLarga(d, hoy){
  if(!d) return 'sin fecha';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(d))) return String(d);
  if(hoy){ if(d===hoy) return 'hoy'; if(d===sumarDias(hoy,1)) return 'mañana'; }
  const t=new Date(d+'T12:00:00Z');
  return DIAS_L[t.getUTCDay()]+' '+t.getUTCDate()+' de '+MESES_L[t.getUTCMonth()];
}

function fechaCorta(d){
  if(!d) return 'sin fecha';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(d))) return String(d);
  const t=new Date(d+'T12:00:00Z');
  return DIAS_C[t.getUTCDay()]+' '+String(t.getUTCDate()).padStart(2,'0')+'-'+String(t.getUTCMonth()+1).padStart(2,'0');
}
/* «hoy a las 16:00», «mañana a las 11:00», «el sábado 24 a las 16:00» */
function cuandoTexto(fecha, hora, hoy){
  if(!fecha) return hora ? ('a las '+hora) : 'cuando lo acordaron';
  let f;
  if(fecha===hoy) f='hoy'; else if(fecha===sumarDias(hoy,1)) f='mañana';
  else { const t=new Date(fecha+'T12:00:00Z'); f='el '+DIAS_L[t.getUTCDay()]+' '+t.getUTCDate(); }
  return f+(hora?(' a las '+hora):'');
}

/* Une dos listas por id. Ninguna escritura puede borrar un registro que no conocía.
   Ante el mismo id gana el que trae más avance: anulado > mayor _rev > el segundo. */
function puntaje(x){
  if(!x || typeof x!=='object') return 0;
  let s=0;
  if(x.anulada||x.anulado) s+=1000000;
  s+=(parseInt(x._rev)||0)*10000;
  return s;
}
function unirPorId(mio, otro){
  const m=new Map();
  (otro||[]).forEach(x=>{ if(x&&x.id!=null) m.set(x.id,x); });
  (mio||[]).forEach(x=>{
    if(!x||x.id==null) return;
    const c=m.get(x.id);
    if(!c){ m.set(x.id,x); return; }
    if(JSON.stringify(c)===JSON.stringify(x)) return;
    m.set(x.id, puntaje(x) > puntaje(c) ? x : c);
  });
  return [...m.values()];
}

/* El cajón: efectivo que entró (ventas + entradas) menos efectivo que salió.
   Los datos de ejemplo (ejemplo:true) no son billetes de verdad: no cuentan en el cierre. */
function efectivoDelDia(d){
  const esEfe = x => x.medio === 'efectivo' && !x.ejemplo;
  const entra = [...delDia(ventas(),d), ...delDia(entradas(),d)].filter(esEfe).reduce((s,x)=>s+(parseInt(x.monto)||0),0);
  const sale = delDia(movs(),d).filter(esEfe)
    .reduce((s,x)=> s + (((TIPOS[x.tipo]||{}).signo)<0 ? (parseInt(x.monto)||0) : 0), 0);
  return { entra, sale, neto: entra-sale };
}
function totalEntre(desde, hasta){
  const dentro = x => x && !x.anulada && x.dia >= desde && x.dia <= hasta;
  return [...ventas(), ...entradas()].filter(dentro).reduce((s,x)=>s+(parseInt(x.monto)||0),0);
}

function marcarAnulado(id, motivo){
  const k=listaDeId(id);

  const nueva=leer(k,[]).map(x => {
    if(x.id!==id || x.anulada) return x;
    anulado = {...x, anulada:true, motivo, anuladaISO:new Date().toISOString(), _rev:(parseInt(x._rev)||0)+1};
    return anulado;
  });

  // Si ese cobro había dejado un pedido como «entregado», el pedido vuelve atrás.
  if(anulado && anulado.alEntregar && anulado.pedidoId) revertirEntrega(anulado.pedidoId, anulado.id);

}

/* El pedido NO guarda plata: la calcula de las ventas y entradas que lo nombran. */
function cuentaPedido(p, libros){
  const L = libros || { ventas:ventas(), entradas:entradas(), movs:movs() };
  const de = arr => (arr||[]).filter(x => x && !x.anulada && x.pedidoId===p.id);
  const pagos = [...de(L.entradas), ...de(L.ventas)].sort((a,b)=>String(a.ts).localeCompare(String(b.ts)));
  const abonado = pagos.reduce((s,x)=>s+(parseInt(x.monto)||0),0);
  const devoluciones = de(L.movs).filter(x=>x.tipo==='devolucion');
  const devuelto = devoluciones.reduce((s,x)=>s+(parseInt(x.monto)||0),0);
  const pagado = abonado - devuelto;
  const total = parseInt(p.total)||0;
  return { total, pagos, abonado, devoluciones, devuelto, pagado, saldo: total - pagado };
}
/* Lo que hay que devolver al cancelar, por medio de pago: cada peso vuelve por donde entró
   (lo pagado en efectivo sale del cajón; lo transferido se devuelve por transferencia…). */
function devolucionPorMedio(cu){
  const porMedio={};
  (cu.pagos||[]).forEach(x=>{ const m=x.medio||'efectivo'; porMedio[m]=(porMedio[m]||0)+(parseInt(x.monto)||0); });
  (cu.devoluciones||[]).forEach(x=>{ const m=x.medio||'efectivo'; porMedio[m]=(porMedio[m]||0)-(parseInt(x.monto)||0); });
  const orden=[...NEGOCIO.medios, ...Object.keys(porMedio).filter(m=>!NEGOCIO.medios.includes(m))];
  return orden.filter(m=>porMedio[m]>0).map(m=>({ medio:m, monto:porMedio[m] }));
}

  const base=((parseInt(it.cant)||1)>1?((parseInt(it.cant)||1)+' × '):'')+it.nombre+(it.opcion?(' · '+it.opcion):'');
  if(conPrecio===false) return base;

function agruparAgenda(lista, hoy){
  const activos=(lista||[]).filter(p=>p && !p.anulada && p.estado!=='entregada' && p.estado!=='cancelada');
  const porDia={};
  activos.forEach(p=>{ const f=(p.entrega&&p.entrega.fecha)||''; const k=!f?'sin':(f<hoy?'atrasados':f); (porDia[k]=porDia[k]||[]).push(p); });
  const orden=(a,b)=>String((a.entrega||{}).fecha||'').localeCompare(String((b.entrega||{}).fecha||'')) ||
                     String((a.entrega||{}).hora||'99').localeCompare(String((b.entrega||{}).hora||'99'));
  const g=[];
  if(porDia.atrasados) g.push({ titulo:'Atrasados', clase:'atras', fecha:'', pedidos:porDia.atrasados.sort(orden) });
  Object.keys(porDia).filter(k=>k!=='atrasados'&&k!=='sin').sort()
    .forEach(f=>g.push({ titulo:capital(fechaLarga(f,hoy)), clase:f===hoy?'hoyG':'', fecha:f, pedidos:porDia[f].sort(orden) }));
  if(porDia.sin) g.push({ titulo:'Sin fecha', clase:'', fecha:'', pedidos:porDia.sin.sort(orden) });
  return g;
}
function contarProximos(lista, hoy){
  const man=sumarDias(hoy,1); const r={hoy:0, manana:0, atrasados:0};
  (lista||[]).forEach(p=>{ if(!p||p.anulada||p.estado==='entregada'||p.estado==='cancelada') return;
    const f=(p.entrega&&p.entrega.fecha)||''; if(f===hoy) r.hoy++; else if(f===man) r.manana++; else if(f && f<hoy) r.atrasados++; });
  r.hoyManana=r.hoy+r.manana;

}

/* El mensaje de WhatsApp para la clienta, según cómo va el pedido. */
function mensajeAviso(p, hoy, cu){
  const nombre=primerNombre(p.cliente&&p.cliente.nombre) || '';
  const items=p.items||[];
  const que = items.length===1 ? textoItem({...items[0], cant:1}, false) : 'pedido';
  const g = items.length===1 ? generoDe(items[0].nombre) : 'o';
  const ent=p.entrega||{}; const cuando=cuandoTexto(ent.fecha, ent.hora, hoy);
  if(p.estado==='lista')
    return ent.tipo==='despacho'
      ? `Hola ${nombre}, tu ${que} está list${g} y te l${g} llevamos ${cuando} 🎂`
      : `Hola ${nombre}, tu ${que} está list${g} para retirar ${cuando} 🎂`;
  if(p.estado==='entregada') return `Hola ${nombre}, ¡gracias por tu pedido en ${NEGOCIO.nombre}! Que lo disfruten 🎂`;
  if(p.estado==='cancelada') return `Hola ${nombre}, tu pedido ${p.folio} en ${NEGOCIO.nombre} quedó cancelado.`;
  let t=`Hola ${nombre}, te confirmo tu pedido ${p.folio} en ${NEGOCIO.nombre}: ${resumenItems(items)}, ${ent.tipo==='despacho'?'te lo llevamos':'para retirar'} ${cuando}.`;

  return t+' ¡Gracias! 🎂';
}

  diez:10, once:11, doce:12, trece:13, catorce:14, quince:15, dieciseis:16, diecisiete:17, dieciocho:18, diecinueve:19,
  veinte:20, veintiun:21, veintiuno:21, veintiuna:21, veintidos:22, veintitres:23, veinticuatro:24, veinticinco:25,
  veintiseis:26, veintisiete:27, veintiocho:28, veintinueve:29, treinta:30, cuarenta:40, cincuenta:50, sesenta:60,
  setenta:70, ochenta:80, noventa:90, cien:100, ciento:100, doscientos:200, doscientas:200, trescientos:300,
  trescientas:300, cuatrocientos:400, cuatrocientas:400, quinientos:500, quinientas:500, seiscientos:600,

/* «treinta y dos mil quinientos» → «32500»; «20 mil» → «20000». Trabaja sobre texto ya normalizado. */
function numerosEnTexto(s){
  const tk=String(s||'').split(' ');
  const out=[]; let i=0;
  const valorDe = w => /^\d+$/.test(w) ? parseInt(w,10) : (NUM_PAL[w]!=null ? NUM_PAL[w] : null);
  const esMult = w => w==='mil' || w==='millon' || w==='millones';
  while(i<tk.length){
    const w=tk[i];
    const trasDigito = esMult(w) && out.length && /^\d+$/.test(out[out.length-1]);
    if(valorDe(w)==null && !esMult(w)){ out.push(w); i++; continue; }
    // ult = lo último que se sumó (número, 'mil' o 'millon'): decide si la palabra que sigue
    // es parte del mismo número («ciento veinte», «treinta y dos», «mil quinientos») o de otro
    // («dos ocho» son dos números, como al dictar un teléfono).
    let total=0, actual=0, ult=null, j=i;
    if(trasDigito){ actual=parseInt(out.pop(),10); ult=actual; }
    while(j<tk.length){
      const x=tk[j], v=valorDe(x);
      if(v!=null){
        let sigue=false;
        if(ult===null || ult==='mil' || ult==='millon') sigue=true;
        else if(ult>=100 && ult<1000 && ult%100===0 && v<100) sigue=true;
        else if(ult>=20 && ult<100 && ult%10===0 && v<10 && tk[j-1]==='y') sigue=true;
        if(!sigue) break;
        actual+=v; ult=v; j++; continue;
      }
      if(x==='y' && typeof ult==='number' && ult>=20 && ult<100 && ult%10===0 && j+1<tk.length && valorDe(tk[j+1])!=null && valorDe(tk[j+1])<10){ j++; continue; }
      if(x==='mil' && ult!=='mil' && ult!=='millon'){ total+=(actual||1)*1000; actual=0; ult='mil'; j++; continue; }
      if((x==='millon'||x==='millones') && ult!=='millon'){ total=(total+(actual||1))*1000000; actual=0; ult='millon'; j++; continue; }
      break;
    }
    if(j===i){ out.push(w); i++; continue; }
    out.push(String(total+actual)); i=j;
  }
  return out.join(' ');
}
function interpretarMonto(t){
  let s=normal(t);
  if(!s) return null;
  if(/\b(gratis|sin costo|no se cobra|no cobro)\b/.test(s)) return 0;
  s=s.replace(/\$\s*/g,' ').replace(/(\d)\.(?=\d{3}\b)/g,'$1').replace(/(\d),(?=\d{3}\b)/g,'$1');
  s=numerosEnTexto(s);
  let m=/(\d+(?:[.,]\d+)?)\s*(lucas?|k)\b/.exec(s);
  if(m) return Math.round(parseFloat(m[1].replace(',','.'))*1000);
  m=/(\d+)[.,](\d)\s*(millon|millones)/.exec(s);
  if(m) return Math.round(parseFloat(m[1]+'.'+m[2])*1000000);
  m=/\b(\d+)\b/.exec(s);
  if(m) return parseInt(m[1],10);
  if(/\bcero\b/.test(s)) return 0;
  return null;
}
function interpretarPersonas(t){
  const s=numerosEnTexto(normal(t));
  if(/\b(no sabe|no se|nose|ni idea)\b/.test(s)) return 0;
  const m=/\b(\d{1,3})\b/.exec(s);
  if(!m) return null;
  const n=parseInt(m[1],10);
  return n>0 && n<=500 ? n : null;
}
const UNID_TEL = { cero:'0', uno:'1', una:'1', un:'1', dos:'2', tres:'3', cuatro:'4', cinco:'5', seis:'6', siete:'7', ocho:'8', nueve:'9' };
/* Un teléfono chileno: '+56912345678'. '' si no tiene. null si no se entendió. */
function interpretarTelefono(t){
  const s=normal(t);
  if(!s) return null;
  if(!/\d/.test(s) && /\b(no tiene|sin telefono|no sabe|ninguno|no)\b/.test(s)) return '';
  const tk=s.replace(/\bmas\b/g,' ').split(/[\s,.\-()\/]+/).filter(Boolean);
  let d='';
  for(let i=0;i<tk.length;i++){
    const w=tk[i];
    if(/^\+?\d+$/.test(w)){ d+=w.replace('+',''); continue; }
    if(UNID_TEL[w]){ d+=UNID_TEL[w]; continue; }
    const v=NUM_PAL[w];
    if(v!=null && v>=10 && v<100){
      if(v%10===0 && v>=20 && tk[i+1]==='y' && UNID_TEL[tk[i+2]]){ d+=String(v+parseInt(UNID_TEL[tk[i+2]],10)); i+=2; continue; }
      d+=String(v); continue;
    }
  }
  if(d.length===11 && d.startsWith('56')) d=d.slice(2);
  if(d.length===9) return '+56'+d;
  if(d.length===8) return '+569'+d;
  return null;
}
function formatoTelefono(t){
  const m=/^\+56(9)(\d{4})(\d{4})$/.exec(String(t||''));
  return m ? ('+56 '+m[1]+' '+m[2]+' '+m[3]) : String(t||'');
}
const PARTICULAS = new Set(['de','del','la','las','los','y','e','van','von']);
function interpretarNombre(t){
  let s=String(t||'').trim().replace(/[.,;:!¡?¿"«»]+/g,' ').replace(/\s+/g,' ').trim();
  s=s.replace(/^(a nombre de|el nombre es|se llama|es para|para|de)\s+/i,'').trim();
  if(!s) return null;
  return s.split(' ').map((w,i)=>{ const l=w.toLowerCase(); return (i>0 && PARTICULAS.has(l)) ? l : (l.charAt(0).toUpperCase()+l.slice(1)); }).join(' ');
}
function interpretarMedio(t){
  const s=normal(t);
  if(/\b(transf|deposit)\w*/.test(s)) return 'transferencia';
  if(/\bdebito\b|redcompra/.test(s)) return 'debito';
  if(/\bcredito\b|cuotas/.test(s)) return 'credito';
  if(/\b(efectivo|plata|billete|billetes|cash|contado)\b/.test(s)) return 'efectivo';
  return null;
}
function interpretarAbono(t){
  const s=normal(t);
  if(!s) return null;
  const monto=interpretarMonto(s.replace(/\b(transferencia|debito|credito|efectivo)\b/g,' '));
  if(monto && monto>0) return { monto, medio:interpretarMedio(s) };
  if(/\b(no|nada|ninguno|sin abono|no dejo)\b/.test(s)) return { ninguno:true };
  return null;
}
function interpretarEntrega(t){
  const s=normal(t);

}

/* «el sábado a las cuatro» → { fecha:'2026-10-24', hora:'16:00' } (hoy es el martes 20). */
function interpretarFechaHora(t, hoy){
  // El dictado de Android escribe «8 p. m.» o «8:30 p.m.»: se deja como «pm» / «am».
  let s=' '+numerosEnTexto(normal(t).replace(/\b([ap])\.?\s?m\b\.?/g,'$1m'))+' ';
  let hora='';
  const fijar=(h, m, mod)=>{
    h=parseInt(h,10); m=parseInt(m||'0',10);
    if(isNaN(h) || h>23 || m>59) return;
    if(mod==='tarde'||mod==='noche'||mod==='pm'){ if(h<12) h+=12; }
    else if(mod==='manana'||mod==='am'){ if(h===12) h=12; }
    else if(h>=1 && h<=7) h+=12;               // una pastelería entrega de tarde: «a las cuatro» = 16:00
    hora=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  };
  const MOD='(?:\\s+(?:de la\\s+)?(manana|tarde|noche)|\\s*(am|pm)\\b)?';
  let m;
  if(/\bmediodia\b/.test(s)){ hora='12:00'; s=s.replace(/\b(al |a )?mediodia\b/,' '); }
  if(!hora && (m=new RegExp('\\b(\\d{1,2})[:h.](\\d{2})\\b'+MOD).exec(s))){ fijar(m[1], m[2], m[3]||m[4]); if(hora) s=s.replace(m[0],' '); }
  if(!hora && (m=new RegExp('\\ba (?:las|la) (\\d{1,2})(?: y (media|cuarto|\\d{1,2})| menos cuarto)?'+MOD+'(?:\\s*(?:hrs|horas|h))?').exec(s))){
    let mi=0; const extra=m[2];
    if(extra==='media') mi=30; else if(extra==='cuarto') mi=15; else if(extra) mi=parseInt(extra,10);
    let h=parseInt(m[1],10);
    if(/menos cuarto/.test(m[0])){ h=h-1; mi=45; }
    fijar(h, mi, m[3]||m[4]); if(hora) s=s.replace(m[0],' ');
  }
  if(!hora && (m=/\b(\d{1,2})(?: y (media|cuarto))? de la (manana|tarde|noche)\b/.exec(s))){ fijar(m[1], m[2]==='media'?30:(m[2]==='cuarto'?15:0), m[3]); if(hora) s=s.replace(m[0],' '); }
  if(!hora && (m=/\b(\d{1,2})\s*(am|pm)\b/.exec(s))){ fijar(m[1], 0, m[2]); if(hora) s=s.replace(m[0],' '); }
  if(!hora && (m=/\b(\d{1,2})\s*(hrs|horas)\b/.exec(s))){ fijar(m[1], 0, parseInt(m[1],10)>=12?'pm':'am'); if(hora) s=s.replace(m[0],' '); }
  s=s.replace(/\bde la manana\b/g,' ');
  let fecha='';
  const anioDe=(d,mes)=>{ let y=parseInt(hoy.slice(0,4),10); let f=y+'-'+String(mes).padStart(2,'0')+'-'+String(d).padStart(2,'0'); if(f<hoy) f=(y+1)+f.slice(4); return f; };
  const valida=f=>{ const t2=new Date(f+'T12:00:00Z'); return !isNaN(t2.getTime()) && t2.toISOString().slice(0,10)===f; };
  const MES='(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)';
  if((m=new RegExp('\\b(\\d{1,2})\\s+(?:de\\s+)?'+MES).exec(s))){
    const nm=m[2]==='setiembre'?9:(['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'].indexOf(m[2])+1);
    const f=anioDe(parseInt(m[1],10), nm); if(valida(f)) fecha=f;
  }
  if(!fecha && (m=/\b(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?\b/.exec(s))){
    let f;
    if(m[3]){ let y=parseInt(m[3],10); if(y<100) y+=2000; f=y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0'); }
    else f=anioDe(parseInt(m[1],10), parseInt(m[2],10));
    if(valida(f)) fecha=f;
  }
  if(!fecha && /\bpasado manana\b/.test(s)) fecha=sumarDias(hoy,2);
  if(!fecha && /\bmanana\b/.test(s)) fecha=sumarDias(hoy,1);
  if(!fecha && /\bhoy\b/.test(s)) fecha=hoy;
  if(!fecha && (m=/\ben (\d+) (dia|dias|semana|semanas)\b/.exec(s))) fecha=sumarDias(hoy, parseInt(m[1],10)*(/semana/.test(m[2])?7:1));
  if(!fecha && /\ben una semana\b/.test(s)) fecha=sumarDias(hoy,7);
  const DS=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
  if(!fecha && (m=/\b(domingo|lunes|martes|miercoles|jueves|viernes|sabado)\b(?:\s+(\d{1,2})\b)?/.exec(s))){
    if(m[2]){
      const dd=parseInt(m[2],10); let y=parseInt(hoy.slice(0,4),10), mo=parseInt(hoy.slice(5,7),10);
      let f=y+'-'+String(mo).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
      if(!valida(f) || f<hoy){ mo++; if(mo>12){ mo=1; y++; } f=y+'-'+String(mo).padStart(2,'0')+'-'+String(dd).padStart(2,'0'); }
      if(valida(f)) fecha=f;
    }
    if(!fecha){
      let delta=(DS.indexOf(m[1]) - diaSemana(hoy) + 7) % 7;
      if(delta===0 && !/\beste\b/.test(s)) delta=7;
      fecha=sumarDias(hoy, delta);
    }
  }
  if(!fecha && (m=/\bel (\d{1,2})\b/.exec(s))){
    const dd=parseInt(m[1],10); let y=parseInt(hoy.slice(0,4),10), mo=parseInt(hoy.slice(5,7),10);
    let f=y+'-'+String(mo).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
    if(!valida(f) || f<hoy){ mo++; if(mo>12){ mo=1; y++; } f=y+'-'+String(mo).padStart(2,'0')+'-'+String(dd).padStart(2,'0'); }
    if(valida(f)) fecha=f;
  }
  return { fecha, hora };
}
/* Busca en la carta lo que se dijo: «cheesecake de maracuyá» → Cheesecake + Maracuyá. */
const GENERICAS = new Set(['torta','de','con','y','la','el','los','las','del','sin','para','g','250','500','una','un']);
function buscarEnCarta(t, carta){
  const s=' '+normal(t).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ')+' ';
  const esta = w => s.includes(' '+w+' ') || s.includes(' '+w+'s ') || s.includes(' '+w+'es ');
  let mejor=null;
  ((carta&&carta.secciones)||[]).forEach((sec,gi)=>(sec.productos||[]).forEach((p,ii)=>{
    const toks=normal(p.nombre).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>1);
    const sig=toks.filter(w=>!GENERICAS.has(w));
    const hit=sig.filter(esta);
    if(!hit.length) return;
    let score=hit.length*10-(sig.length-hit.length)*4+(hit.length===sig.length?5:0);
    let opcion='';
    if(Array.isArray(p.opciones)){
      let mo=0;
      p.opciones.forEach(o=>{ const ot=normal(o).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>1&&!GENERICAS.has(w));
        if(ot.length && ot.every(esta) && ot.length>mo){ mo=ot.length; opcion=o; } });
      score+=mo*10;
    }
    if(!mejor || score>mejor.score) mejor={ score, gi, ii, producto:p, opcion };
  }));
  return mejor;
}
function cantidadDe(t){
  const m=/^\s*(\d{1,2})\b/.exec(numerosEnTexto(normal(t)));
  const n=m?parseInt(m[1],10):1;
  return n>0 && n<=50 ? n : 1;
}
/* Lo que se dijo en «¿Qué quiere?» → una línea del pedido. */
function itemDesdeTexto(t, carta){
  const b=buscarEnCarta(t, carta||CARTA);
  const cant=cantidadDe(t);
  if(b){
    const pr=precioDe(b.producto);
    return { nombre:b.producto.nombre, opcion:b.opcion||'', cant, precio:pr, op:(Array.isArray(b.producto.opciones)&&b.producto.opciones.length)?b.producto.opciones:null };
  }
  const nombre=capital(String(t||'').trim().replace(/^(quiere|quiero|una|un)\s+/i,''));
  return { nombre, opcion:'', cant:1, precio:0, op:null };
}

/* ═════════ 7. El ticket en 3 copias (48 columnas) ═════════
   Sin mayúsculas con tilde (muchas impresoras usan la tabla cp437, donde Á Í Ó Ú no
   existen). Cada línea es {t, g (letra grande), c (centrada)}. */
const ANCHO = 48, ANCHO_G = 24;
const CP437 = {'Ç':0x80,'ü':0x81,'é':0x82,'â':0x83,'ä':0x84,'à':0x85,'ç':0x87,'ê':0x88,'ë':0x89,'è':0x8A,'ï':0x8B,
  'î':0x8C,'ì':0x8D,'Ä':0x8E,'ô':0x93,'ö':0x94,'ò':0x95,'û':0x96,'ù':0x97,'Ö':0x99,'Ü':0x9A,'á':0xA0,'í':0xA1,
  'ó':0xA2,'ú':0xA3,'ñ':0xA4,'Ñ':0xA5,'ª':0xA6,'º':0xA7,'¿':0xA8,'½':0xAB,'¡':0xAD,'°':0xF8,'·':0xFA};
function limpiarTicket(s){
  s=String(s==null?'':s)
    .replace(/[ÁÀÂÄ]/g,'A').replace(/[ÉÈÊË]/g,'E').replace(/[ÍÌÎÏ]/g,'I').replace(/[ÓÒÔÖ]/g,'O').replace(/[ÚÙÛÜ]/g,'U')
    .replace(/[“”«»]/g,'"').replace(/[‘’]/g,"'").replace(/[–—]/g,'-').replace(/…/g,'...').replace(/×/g,'x').replace(/\s+/g,' ');
  let r='';
  for(const ch of s){ const c=ch.charCodeAt(0); if((c>=0x20 && c<=0x7e) || CP437[ch]!=null) r+=ch; }
  return r.replace(/\s+/g,' ').trim();
}
function envolver(texto, ancho){
  const out=[]; let l='';
  String(texto||'').split(' ').forEach(w=>{
    while(w.length>ancho){ if(l){ out.push(l); l=''; } out.push(w.slice(0,ancho)); w=w.slice(ancho); }
    if(!w) return;
    if(!l) l=w; else if((l+' '+w).length<=ancho) l+=' '+w; else { out.push(l); l=w; }
  });
  if(l) out.push(l);
  return out.length?out:[''];
}
function lineasTicket(p, cu, etiqueta, local){
  const L=[]; const cocina = etiqueta==='COCINA';
  const add=(t, o)=>{ o=o||{}; const s=o.s||0; envolver(limpiarTicket(t), (o.g?ANCHO_G:ANCHO)-s).forEach(x=>L.push({ t:' '.repeat(s)+x, g:!!o.g, c:!!o.c })); };
  const sep=()=>L.push({ t:'-'.repeat(ANCHO), g:false, c:false });
  const fila=(izq, monto, o)=>{ const der=limpiarTicket(clp(monto)); const ancho=ANCHO-der.length-1;
    const ls=envolver(limpiarTicket(izq), ancho); ls.forEach((x,i)=>L.push({ t: i===0 ? (x.padEnd(ancho,' ')+' '+der) : x, g:false, c:false })); };
  const ent=p.entrega||{}, cli=p.cliente||{};
  const cancelado = p.estado==='cancelada';
  const cuando=fechaCorta(ent.fecha)+(ent.hora?(' '+ent.hora):'');
  add(NEGOCIO.ticket, {c:true});
  if(local && local.telefono && !cocina) add('Tel: '+local.telefono, {c:true});
  add('PEDIDO '+(p.folio||''), {c:true, g:true});
  if(cancelado) add(cocina?'CANCELADO: NO HACER':'** CANCELADO **', {c:true, g:true});
  add('Hecho: '+fechaHoraTicket(p.creadoISO)+(p.quien?('  Atendió: '+p.quien):''));
  sep();
  if(cocina){ add('PARA: '+cuando, {g:true}); add(ent.tipo==='despacho'?'DESPACHO A DOMICILIO':'RETIRA EN EL LOCAL'); }
  else add((ent.tipo==='despacho'?'DESPACHO ':'RETIRO: ')+cuando, {g:true});
  if(ent.tipo==='despacho' && ent.direccion) add('Dirección: '+ent.direccion);
  add('Cliente: '+(cli.nombre||''));
  if(!cocina && cli.telefono) add('Teléfono: '+formatoTelefono(cli.telefono));
  sep();
  (p.items||[]).forEach(it=>{
    const nom=(parseInt(it.cant)||1)+' x '+it.nombre;
    if(cocina){ add(nom, {g:true}); if(it.opcion) add(it.opcion, {g:true, s:2}); }
    else { fila(nom, (parseInt(it.precio)||0)*(parseInt(it.cant)||1)); if(it.opcion) add(it.opcion, {s:4}); }
  });
  if(p.personas) add('Para '+p.personas+' personas', cocina?{g:true}:{});
  const texto=limpiarTicket(p.texto);
  if(texto){ if(cocina){ add('TEXTO DE LA TORTA:'); add('"'+texto+'"', {g:true}); } else add('Texto: "'+texto+'"'); }
  else if(cocina) add('Sin texto en la torta');
  if(p.notas) add('Notas: '+p.notas);
  if(!cocina){
    if(ent.tipo==='despacho') fila('Despacho', parseInt(ent.costoDespacho)||0);
    sep();
    if(cu.total) fila('TOTAL', cu.total); else add('TOTAL: por confirmar');
    // El cobro final es una venta (V-…): «Pago»; lo de antes son abonos (E-…).
    cu.pagos.forEach(x=>fila((String(x.id).startsWith('V-')?'Pago ':'Abono ')+medioL(x.medio)+' '+fechaCorta(x.dia).slice(4), x.monto));
    if(cu.devuelto) fila('Devuelto', cu.devuelto);
    if(cancelado) add(cu.pagado>0 ? ('Quedó con '+clp(cu.pagado)+' de abono') : 'Sin plata pendiente');
    else if(cu.total){ const sal=Math.max(0, cu.saldo); L.push({ t:('SALDO '+limpiarTicket(clp(sal))), g:true, c:false }); }
  }
  sep();
  if(etiqueta==='CLIENTE' && !cancelado) add(ent.tipo==='despacho' ? 'Presente este ticket al recibir.' : 'Presente este ticket al retirar.', {c:true});
  add('COPIA: '+etiqueta, {c:true});
  return L;
}
function copiasTicket(p, cu, local){
  return ['CLIENTE','JACINTA','COCINA'].map(e=>{ const lineas=lineasTicket(p, cu, e, local); return { etiqueta:e, lineas, texto:textoTicket(lineas) }; });
}
function textoTicket(lineas){
  return lineas.map(l=>{ const a=l.g?ANCHO_G:ANCHO; return l.c ? (' '.repeat(Math.max(0,Math.floor((a-l.t.length)/2)))+l.t) : l.t; }).join('\n');
}
/* ESC/POS: ESC @ (reinicia), ESC t 0 (tabla cp437), ESC a (centrar), GS ! (letra grande), GS V 66 0 (corta). */
function bytesEscPos(copias){
  const b=[];
  const txt=s=>{ for(const ch of s){ const c=ch.charCodeAt(0); if(c>=0x20&&c<=0x7e) b.push(c); else if(CP437[ch]!=null) b.push(CP437[ch]); else b.push(0x3F); } };
  copias.forEach(cp=>{
    b.push(0x1B,0x40, 0x1B,0x74,0x00);
    cp.lineas.forEach(l=>{ b.push(0x1B,0x61,l.c?1:0, 0x1D,0x21,l.g?0x11:0x00); txt(l.t); b.push(0x0A); });
    b.push(0x1D,0x21,0x00, 0x1B,0x61,0x00, 0x0A,0x0A,0x0A,0x0A);
    b.push(0x1D,0x56,0x42,0x00);
  });
  return b;
}
function trozos(bytes, n){ n=n||100; const r=[]; for(let i=0;i<bytes.length;i+=n) r.push(bytes.slice(i,i+n)); return r; }
const B64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
function aBase64(bytes){
  let r='';
  for(let i=0;i<bytes.length;i+=3){
    const a=bytes[i], b2=bytes[i+1], c=bytes[i+2];
    const n=(a<<16)|((b2||0)<<8)|(c||0);
    r+=B64[(n>>18)&63]+B64[(n>>12)&63]+(i+1<bytes.length?B64[(n>>6)&63]:'=')+(i+2<bytes.length?B64[n&63]:'=');
  }
  return r;
}
function urlRawbt(bytes){ return 'intent:base64,'+aBase64(bytes)+'#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;'; }

}

const BT_SERVICIOS = ['000018f0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb',
                      'e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455'];
let BT = null;
let BT_TROZO = 100;      // si la impresora no acepta 100 bytes de una vez, baja a 20 (ver enviarBT)
/* pedir: si no hay impresora recordada, abre el selector. otra: abre el selector SIEMPRE
   (para cambiar de impresora), sin usar la que estaba guardada. */
async function conectarBT(pedir, otra){
  if(typeof navigator==='undefined' || !navigator.bluetooth) throw new Error('este navegador no tiene Bluetooth (usa Chrome en Android, o elige RawBT o el diálogo de impresión)');
  if(!otra && BT && BT.device && BT.device.gatt && BT.device.gatt.connected && BT.car) return BT;
  let device = otra ? null : (BT && BT.device);
  if(!device && !otra && navigator.bluetooth.getDevices){
    try{ const ds=await navigator.bluetooth.getDevices(); const id=leerG('bt',''); device=ds.find(d=>d.id===id)||null; }catch(e){}
  }
  if(!device){
    if(!pedir) throw new Error('no hay impresora elegida');
    device = await navigator.bluetooth.requestDevice({ acceptAllDevices:true, optionalServices:BT_SERVICIOS });
  }
  const srv = await device.gatt.connect();
  let car=null;
  const buscar = cs => (cs||[]).find(c=>c.properties && (c.properties.write || c.properties.writeWithoutResponse)) || null;
  for(const u of BT_SERVICIOS){ if(car) break; try{ const s=await srv.getPrimaryService(u); car=buscar(await s.getCharacteristics()); }catch(e){} }
  if(!car){ try{ for(const s of await srv.getPrimaryServices()){ car=buscar(await s.getCharacteristics()); if(car) break; } }catch(e){} }
  if(!car) throw new Error('la impresora no tiene por dónde recibir el texto');
  BT = { device, car };
  grabarG('bt', device.id); guardarConfig({ btNombre: device.name || 'Impresora Bluetooth' });
  return BT;
}
async function escribirBT(car, u8){
  if(car.properties.writeWithoutResponse && car.writeValueWithoutResponse) return car.writeValueWithoutResponse(u8);
  if(car.writeValueWithResponse) return car.writeValueWithResponse(u8);
  return car.writeValue(u8);
}
/* Manda los bytes en trozos de 100. Si el primer trozo falla (hay teléfonos que solo aceptan
   20 bytes por envío), sigue con trozos de 20 desde ese mismo punto y lo recuerda. */
async function enviarBT(bytes){
  const b=await conectarBT(true);
  let i=0;
  while(i<bytes.length){
    const n=BT_TROZO, u8=new Uint8Array(bytes.slice(i, i+n));
    try{ await escribirBT(b.car, u8); }
    catch(e){ if(n>20 && i===0){ BT_TROZO=20; continue; } throw e; }
    i+=n;
    await esperarMs(25);
  }
}
/* Alto de la hoja para el diálogo de impresión: lo que mide la copia más larga
   (línea normal 2,5 mm × 1,3; grande 5 mm × 1,2; más márgenes). Así queda una hoja por copia. */
function altoPaginaMm(copias){
  const alto=cp=>cp.lineas.reduce((s,l)=>s+(l.g?6:3.25),0)+3.25;
  return Math.ceil(Math.max(40, ...copias.map(alto)) + 6 + 4);
}
function imprimirDialogo(copias){
  const el=document.getElementById('impresion'); if(!el) return;
  el.innerHTML=htmlCopias(copias);
  try{
    let st=document.getElementById('hojaImpresion');
    if(!st){ st=document.createElement('style'); st.id='hojaImpresion'; document.head.appendChild(st); }
    st.textContent='@page{size:80mm '+altoPaginaMm(copias)+'mm;margin:3mm}';
  }catch(e){}
  try{ window.print(); }catch(e){}
}
async function imprimirCopias(copias){
  const tipo=config().impresora||'dialogo';
  try{
    if(tipo==='bluetooth'){ await enviarBT(bytesEscPos(copias)); return { ok:true, msg:'🖨 Enviado a la impresora Bluetooth' }; }
    if(tipo==='rawbt'){ location.href=urlRawbt(bytesEscPos(copias)); return { ok:true, msg:'🖨 Enviado a RawBT' }; }
    imprimirDialogo(copias); return { ok:true, msg:'🖨 Se abrió el diálogo de impresión' };
  }catch(e){
    const por=(e&&e.message)||String(e);
    if(tipo==='bluetooth' && confirm('No se pudo imprimir por Bluetooth: '+por+'.\n\n¿Lo imprimo con el diálogo del teléfono?')){
      imprimirDialogo(copias); return { ok:true, msg:'🖨 Se abrió el diálogo de impresión' };
    }
    return { ok:false, msg:'No se pudo imprimir: '+por };
  }
}

/* ═════════ 9. La puerta (clave del teléfono) ═════════
   La clave se crea la primera vez. Si en Configuración se activa «Pedir la clave al abrir»
   (pedirClave), se pide cada vez que la app se abre de cero (no al volver de WhatsApp o de
   la cámara: eso sigue siendo la misma sesión). Frena al curioso; no es el candado de los datos. */
async function huella(txt){
  try{ const b=new TextEncoder().encode('jacinta:'+txt); const h=await crypto.subtle.digest('SHA-256', b);
    return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  catch(e){ return 'plano:'+txt; }
}

function aplicarRespaldo(obj){

/* El respaldo va como .txt (text/plain) aunque adentro es JSON: Chrome en Android no deja

function archivoRespaldo(){ return 'respaldo-jacinta-'+hoyStr()+'.txt'; }
const TIPO_RESPALDO = 'text/plain';
async function guardarRespaldo(){
  const texto=JSON.stringify(respaldo(), null, 1);
  let como='';
  try{
    if(typeof File!=='undefined' && typeof navigator!=='undefined' && navigator.canShare && navigator.share){
      const f=new File([texto], archivoRespaldo(), { type:TIPO_RESPALDO });
      if(navigator.canShare({ files:[f] })){
        await navigator.share({ files:[f], title:'Respaldo de '+NEGOCIO.corto, text:'Respaldo de la app de '+NEGOCIO.nombre+' ('+hoyStr()+')' });
        como='compartido';
      }
    }
  }catch(e){
    if(e && e.name==='AbortError') return;          // cerró la ventana de compartir: no pasó nada
  }
  if(!como){
    try{
      const blob=new Blob([texto],{type:TIPO_RESPALDO});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=archivoRespaldo();
      document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
      como='descargado';
    }catch(e){ alert('No se pudo armar el respaldo en este teléfono.'); return; }
  }
  guardarConfig({ ultimoRespaldo:new Date().toISOString() });
  if(como==='descargado') alert('El respaldo ('+archivoRespaldo()+') quedó en la carpeta Descargas de este equipo.\n\nMándatelo por WhatsApp o guárdalo en Drive: si se pierde el teléfono, el respaldo se pierde con él.');

}

      alert(n ? ('Listo: entraron '+n+' registro'+(n===1?'':'s')+' que faltaban. No se borró nada.') : 'Listo: el teléfono ya tenía todo lo del respaldo. No se borró nada.');
    }catch(e){ alert(e.message||'No se pudo leer el respaldo.'); }

function validarCarta(c){
  if(!c || typeof c!=='object' || !Array.isArray(c.secciones) || !c.secciones.length) return false;
  return c.secciones.every(s=>s && typeof s.titulo==='string' && Array.isArray(s.productos) &&
    s.productos.every(p=>p && typeof p.nombre==='string' && p.nombre.trim() && Number.isInteger(p.precio) && p.precio>=0 &&
      (p.opciones==null || (Array.isArray(p.opciones) && p.opciones.every(o=>typeof o==='string')))));
}

/* Si carta.json llegó pero tiene un error (una coma de más, un precio con letras…), la app
   sigue con la carta anterior y LO DICE (en el inicio, la carta y la configuración). */
let CARTA_AVISO = '';
async function cargarCarta(){
  if(typeof location==='undefined' || !/^https?:$/.test(location.protocol) || typeof fetch!=='function') return;
  let r;
  try{ r=await fetch('./carta.json', { cache:'no-cache' }); }catch(e){ return; }   // sin señal: no es un error de la carta
  if(!r || !r.ok) return;
  let c=null, aviso='';
  try{ c=JSON.parse(await r.text()); }catch(e){ aviso='carta.json tiene un error de escritura (revisa comas, comillas y llaves).'; }
  if(!aviso && !validarCarta(c)) aviso='carta.json no tiene la forma esperada (cada producto necesita "nombre" y un "precio" en números, sin puntos ni $).';

    ...(temp.entregar ? { alEntregar:true } : {}),

  const k = temp.modo==='venta' ? 'ventas' : (temp.modo==='mov' ? 'movs' : 'entradas');

  marcarUltimo(reg, temp.modo==='mov' ? (TIPOS[temp.tipo]||{}).l : (temp.concepto || (temp.modo==='venta'?'Venta':'Entró plata')));
  ir('listo', {...temp, medio, entregado:!!entregado, folioPedido: entregado ? entregado.folio : (temp.pedidoId ? ((pedidoPorId(temp.pedidoId)||{}).folio||'') : '')});

  if(!v.length && !e.length && !m.length){ L.push('_Todavía no hay nada anotado hoy._'); return L.join('\n'); }
  L.push('Entró: *'+clp(tot)+'*  ('+(v.length+e.length)+' movimiento'+((v.length+e.length)===1?'':'s')+')');
  Object.keys(porMedio).forEach(k=>L.push('· '+medioL(k)+': '+clp(porMedio[k])));
  if(m.length){ L.push(''); L.push('Movimientos:'); m.forEach(x=>{ L.push('· '+((TIPOS[x.tipo]||{}).l||'Movimiento')+(x.concepto?(' '+x.concepto):'')+': '+clp(x.monto)); }); }
  const entregados=pedidos().filter(p=>!p.anulada && p.estado==='entregada' && (p.historial||[]).some(h=>h.estado==='entregada' && diaDeISO(h.ts)===d)).length;

  if(c){ L.push(''); L.push('Cierre: contado '+clp(c.contado)+' · esperado '+clp(c.esperado));
    L.push(c.diferencia===0?'Calzó exacto ✅':(c.diferencia>0?('Sobraron '+clp(c.diferencia)):('Faltaron '+clp(-c.diferencia)))); }
  return L.join('\n');
}

function convNueva(){

function pasoActivo(k, r){ const p=PASOS[k]; return !(p.activo && !p.activo(r)); }
function pasoActual(){
  if(!CONV) return null;

  for(const k of ORDEN){ const p=PASOS[k];
    if(!pasoActivo(k, r)) continue;

}

function aplicarRespuesta(campo, valor, dicho){
  if(!CONV) return;

  p.poner(CONV.resp, valor);
  CONV.hechos[campo]=true;
  CONV.dichos[campo]=dicho||'';
  // Si cambia lo que suma (qué, despacho), el total se vuelve a preguntar con la nueva sugerencia.
  if(campo==='que'||campo==='costoDespacho'||campo==='tipo') delete CONV.hechos.total;
  CONV.pendiente=null; CONV.noEntendi=null;
  guardarBorrador(); pintar(); bajarChat();

/* Responder escribiendo o hablando. Lo hablado siempre se confirma (el dictado se equivoca). */
function responder(texto, porVoz){
  if(!CONV) return;
  texto=String(texto||'').trim(); if(!texto) return;
  const campo=pasoActual(); if(!campo) return;
  const res=PASOS[campo].interpretar(texto);
  if(!res){ CONV.noEntendi=texto; CONV.pendiente=null; guardarBorrador(); pintar(); bajarChat(); return; }
  const conOpciones = campo==='que' && res.valor && res.valor.op && !res.valor.opcion;
  if(!porVoz && !conOpciones && normal(res.mostrar)===normal(texto)){ aplicarRespuesta(campo, res.valor, texto); return; }
  CONV.pendiente={ campo, dicho:texto, valor:res.valor, mostrar:res.mostrar, opciones: conOpciones ? res.valor.op : null };
  CONV.noEntendi=null; guardarBorrador(); pintar(); bajarChat();
}

function guardarPedido(){

  GUARDANDO_PED=true;
  try{
    const ahora=new Date().toISOString();
    const lista=pedidos();
    const datos=pedidoDesdeResp(r);
    const antes=lista.find(x=>x.id===CONV.id);
    let p, nueva;
    if(antes){ p={ ...antes, ...datos, editadoISO:ahora, _rev:(parseInt(antes._rev)||0)+1 }; nueva=lista.map(x=>x.id===p.id?p:x); }
    else { p={ id:CONV.id, folio:siguienteFolio(lista), creadoISO:ahora, ...datos, estado:'por-hacer', historial:[{ ts:ahora, estado:'por-hacer' }], anulada:false, quien:quienSoy()||null, _rev:1 }; nueva=[p, ...lista]; }
    if(!grabar('pedidos', nueva)){
      if(p.fotoRef){ p={ ...p, fotoRef:'' }; nueva=nueva.map(x=>x.id===p.id?p:x);
        if(!grabar('pedidos', nueva)){ avisarLleno('el pedido'); return null; }
        alert('El teléfono está casi lleno: el pedido se guardó SIN la foto. Respalda y quita fotos de pedidos entregados en Configuración.');
      } else { avisarLleno('el pedido'); return null; }
    }
    CONV.folio=p.folio;
    // El abono es una ENTRADA de plata al día (el pedido no guarda plata). Id fijo: no se duplica.
    if(!CONV.editando && r.abono && r.abono.monto>0 && !entradas().some(x=>x.id===CONV.abonoId)){
      const e={ id:CONV.abonoId, dia:hoyStr(), ts:ahora, monto:parseInt(r.abono.monto)||0, medio:r.abono.medio||'efectivo',
        concepto:'Abono pedido '+p.folio, pedidoId:p.id, quien:quienSoy()||null, anulada:false };
      if(grabar('entradas', [e, ...entradas()])) marcarUltimo(e, 'Abono pedido '+p.folio);

    }
    if(!CONV.editando) borrarG('borrador');
    return p;
  } finally { GUARDANDO_PED=false; }
}

/* La foto de referencia: comprimida y guardada en el teléfono. Vive en los mismos ~5 millones
   de caracteres que la plata, así que se achica bastante: 640 px y como máximo 60 mil
   caracteres (unos 45 KB). Alcanza para ver la idea de la torta. */
const FOTO_MAX = 60000, FOTO_LADO = 640, FOTO_CALIDAD = 0.6;
function leerFoto(input){
  const f=input.files && input.files[0]; if(!f) return;
  comprimirFoto(f).then(url=>{ if(CONV) aplicarRespuesta('foto', url, 'foto'); })
    .catch(()=>alert('No se pudo usar esa foto. Prueba con otra o sigue sin foto.'));
  input.value='';
}
function comprimirFoto(file){
  return new Promise((ok, mal)=>{
    const rd=new FileReader();
    rd.onerror=()=>mal(new Error('lectura'));
    rd.onload=()=>{
      const img=new Image();
      img.onerror=()=>mal(new Error('imagen'));
      img.onload=()=>{
        let lado=FOTO_LADO, q=FOTO_CALIDAD, url='';
        for(let i=0;i<12;i++){
          const k=Math.min(1, lado/Math.max(img.width,img.height));
          const w=Math.max(1,Math.round(img.width*k)), h=Math.max(1,Math.round(img.height*k));
          const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
          cv.getContext('2d').drawImage(img,0,0,w,h);
          url=cv.toDataURL('image/jpeg', q);
          if(url.length<=FOTO_MAX) return ok(url);
          if(q>0.45) q=Math.round((q-0.1)*100)/100; else lado=Math.round(lado*0.8);
        }
        mal(new Error('muy grande'));
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  });
}

  const ids=new Set(cerrados.map(p=>p.id));

let REC=null, VOZ=null;
function hayDictado(){ return typeof window!=='undefined' && !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function elegirVoz(){
  try{ const vs=speechSynthesis.getVoices()||[];
    for(const l of ['es-cl','es-us','es-419','es-mx','es-es']){ const v=vs.find(x=>String(x.lang||'').replace('_','-').toLowerCase()===l); if(v) return v; }
    return vs.find(x=>/^es/i.test(x.lang||''))||null; }catch(e){ return null; }
}
function hablar(txt){
  try{
    if(!config().hablar || typeof speechSynthesis==='undefined' || typeof SpeechSynthesisUtterance==='undefined') return;
    const sonando = speechSynthesis.speaking || speechSynthesis.pending;
    speechSynthesis.cancel();
    const dicho=String(txt).replace(/\$\s?([\d.]+)/g,(m,n)=>n.replace(/\./g,'')+' pesos').replace(/[\uD800-\uDFFF\u2600-\u27BF]/g,' ');
    const u=new SpeechSynthesisUtterance(dicho);
    const v=VOZ||elegirVoz(); if(v){ u.voice=v; u.lang=v.lang; } else u.lang='es-CL';
    u.rate=0.95;
    if(sonando) setTimeout(()=>{ try{ speechSynthesis.speak(u); }catch(e){} }, 80);   // Chrome a veces bota lo que sigue a un cancel()
    else speechSynthesis.speak(u);
  }catch(e){}
}
function callar(){ try{ if(typeof speechSynthesis!=='undefined') speechSynthesis.cancel(); }catch(e){} }
function alternarVoz(){ const h=!config().hablar; guardarConfig({ hablar:h }); if(!h) callar(); else if(CONV) CONV.ultimoHablado=null; pintar(); }
function hablarPregunta(){
  if(!CONV || ruta!=='pedido') return;
  const k=pasoActual(); let cl, txt;
  if(CONV.noEntendi){ cl='?'+CONV.noEntendi; txt='No te entendí. ¿Me lo repites o lo escribes?'; }
  else if(CONV.pendiente){ if(!CONV.pendiente.opciones) return; cl='op:'+CONV.pendiente.mostrar; txt='¿Cuál? Elige una.'; }
  else if(k){ cl=k+':'+Object.keys(CONV.hechos).length; txt=PASOS[k].q(); }
  else { cl='resumen'; txt='Listo. Revisa el resumen y toca imprimir o guardar.'; }
  if(CONV.ultimoHablado===cl) return;
  CONV.ultimoHablado=cl; hablar(txt);
}
function marcarMic(on){
  const b=document.getElementById('mic'); if(b){ b.classList.toggle('on', on); b.textContent=on?'■':'🎙'; }
  const ev=document.getElementById('enVivo'); if(ev && on) ev.textContent='Te escucho… toca ■ cuando termines';
}
function escuchar(){
  if(REC){ try{ REC.stop(); }catch(e){} return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ alert('Este teléfono no tiene dictado en el navegador. Escribe la respuesta.'); return; }
  callar();
  let r; try{ r=new SR(); }catch(e){ alert('No se pudo usar el micrófono. Escribe la respuesta.'); return; }
  r.lang='es-CL'; r.interimResults=true; r.maxAlternatives=1; r.continuous=false;
  let dicho='';
  r.onresult=ev=>{ let t=''; for(let i=0;i<ev.results.length;i++) t+=ev.results[i][0].transcript; dicho=t;
    const el=document.getElementById('enVivo'); if(el) el.textContent='«'+t+'»'; };
  r.onerror=ev=>{ const e=ev&&ev.error;
    if(e==='not-allowed'||e==='service-not-allowed') alert('El teléfono no dio permiso para usar el micrófono. Puedes escribir la respuesta.');
    else if(e==='network') alert('El dictado necesita internet. Escribe la respuesta o vuelve a intentar.'); };
  r.onend=()=>{ REC=null; marcarMic(false); if(dicho.trim()) responder(dicho.trim(), true);
    else { const el=document.getElementById('enVivo'); if(el) el.textContent='No escuché nada. Toca el micrófono y vuelve a intentar.'; } };
  REC=r;
  try{ r.start(); marcarMic(true); }catch(e){ REC=null; alert('No se pudo usar el micrófono. Escribe la respuesta.'); }
}
function pararDictado(){ if(REC){ try{ REC.abort(); }catch(e){} REC=null; } }

function cambiarEstado(id, estado){
  const p=pedidoPorId(id); if(!p || p.estado===estado) return;
  if(p.estado==='cancelada' || p.estado==='entregada'){ alert('Este pedido ya está '+ESTADOS[p.estado].l.toLowerCase()+'.'); return; }
  if(estado==='entregada'){
    const cu=cuentaPedido(p);
    if(cu.total && cu.saldo>0){
      if(confirm('Todavía debe '+clp(cu.saldo)+'.\n\n¿Le cobras el saldo ahora?')){ cobrarSaldo(id); return; }
      if(!confirm('¿Marcarlo como entregado igual? Va a quedar debiendo '+clp(cu.saldo)+'.\n\nLo cobras después desde la ficha del pedido («Cobrar lo que debe»).')) return;
    }
  }
  if(!guardarPedidoEditado(conEstado(p, estado, new Date().toISOString()))){ avisarLleno('el cambio'); return; }
  delete temp.impresion; pintar();
}
/* Cobra lo que falta. Si el pedido no se ha entregado, al cobrar queda entregado; si ya se
   entregó debiendo, solo entra la plata (el estado no cambia). */
function cobrarSaldo(id){
  const p=pedidoPorId(id); if(!p) return;
  if(p.estado==='cancelada'){ alert('Este pedido está cancelado.'); return; }
  const cu=cuentaPedido(p);
  if(cu.saldo<=0){ alert('Este pedido ya está pagado.'); return; }
  const entregar = p.estado!=='entregada';
  ir('medio',{ modo:'venta', monto:cu.saldo, concepto:'Saldo pedido '+p.folio+' · '+resumenItems(p.items).slice(0,50), pedidoId:id, ...(entregar?{ entregar:true }:{}) });
}
function anotarAbono(id){
  const p=pedidoPorId(id); if(!p) return;
  if(p.estado==='cancelada'){ alert('Este pedido está cancelado.'); return; }
  ir('monto',{ modo:'entrada', concepto:'Abono pedido '+p.folio, pedidoId:id });
}
function revertirEntrega(pedidoId, ventaId){
  const p=pedidoPorId(pedidoId); if(!p || p.estado!=='entregada') return;
  const h=p.historial||[]; const ult=h[h.length-1];
  if(!ult || ult.ventaId!==ventaId) return;
  const antes=[...h].reverse().find(x=>x.estado!=='entregada');
  guardarPedidoEditado(conEstado(p, (antes&&antes.estado)||'lista', new Date().toISOString(), { motivo:'se anuló el cobro del saldo' }));
}
function cancelarPedido(id){
  const p=pedidoPorId(id); if(!p) return;
  const motivo=prompt('¿Por qué se cancela el pedido? (queda anotado)');
  if(motivo===null) return;
  if(!String(motivo).trim()){ alert('Hay que escribir el motivo.'); return; }
  const cu=cuentaPedido(p);
  let devuelto=0;
  // Cada peso vuelve por el medio por el que entró: una devolución por medio de pago.
  const dev=cu.pagado>0 ? devolucionPorMedio(cu) : [];
  const detalle=dev.map(d=>'· '+clp(d.monto)+' '+(d.medio==='efectivo'?'en efectivo (sale del cajón)':('por '+medioL(d.medio).toLowerCase()))).join('\n');
  if(dev.length && confirm('Dejó '+clp(cu.pagado)+' de abono.\n\n¿Se lo devuelves?\n\nAceptar = sí, le devuelvo:\n'+detalle+'\n\nCancelar = no, me quedo con el abono.')){
    const ts=new Date().toISOString(), ej=!!p.ejemplo;
    const nuevos=dev.map(d=>({ id:idNuevo('M'), dia:hoyStr(), ts, monto:d.monto, medio:d.medio, concepto:'Devolución abono '+p.folio,
      tipo:'devolucion', pedidoId:p.id, quien:quienSoy()||null, anulada:false, ...(ej?{ ejemplo:true }:{}) }));
    if(!grabar('movs', [...nuevos, ...movs()])){ avisarLleno('la devolución (el pedido sigue sin cancelar)'); return; }
    devuelto=nuevos.reduce((s,x)=>s+x.monto,0);
  }
  if(!guardarPedidoEditado(conEstado(p, 'cancelada', new Date().toISOString(), { motivo:String(motivo).trim(), devuelto }))){
    avisarLleno('la cancelación'+(devuelto?' (la devolución sí quedó anotada)':'')); pintar(); return;
  }
  pintar();
}

  // «Conectar / cambiar»: siempre abre la lista para elegir (aunque haya una recordada).
  try{ try{ if(BT && BT.device && BT.device.gatt && BT.device.gatt.connected) BT.device.gatt.disconnect(); }catch(e){}
    BT=null; BT_TROZO=100; await conectarBT(true, true); alert('Listo: impresora conectada ('+(config().btNombre||'Bluetooth')+').'); }
  catch(e){ alert('No se pudo conectar: '+((e&&e.message)||e)); }
  pintar();
}

    <div class="rot">Impresora de tickets</div>
    ${op('dialogo','📄','Diálogo de impresión','cualquier teléfono o computador (también guarda PDF)')}
    ${op('bluetooth','🔵','Bluetooth','impresora térmica al lado · Chrome en Android')}
    ${op('rawbt','🤖','RawBT (Android)','Bluetooth clásico o impresora de red con la app RawBT')}
    ${c.impresora==='bluetooth'?`<button class="btn plano" onclick="conectarImpresora()">🔗 ${c.btNombre?('Impresora: '+esc(c.btNombre)+' · cambiar'):'Conectar la impresora'}</button>`:''}
    <button class="btn plano" onclick="probarImpresora()">🖨 Probar la impresora</button>
    <div class="rot">Respaldo</div>
    <div class="nota" style="text-align:left">${c.ultimoRespaldo?('Último respaldo: '+esc(fechaHoraTicket(c.ultimoRespaldo))+(dias?(' (hace '+dias+' día'+(dias===1?'':'s')+')'):' (hoy)')):'Todavía no respaldas en este teléfono.'}</div>
    <button class="btn chico" onclick="guardarRespaldo()"><span class="em">📦</span><span class="txt">Respaldar<small>un archivo con todo para mandarte por WhatsApp o guardar en Drive</small></span></button>
    <button class="btn chico" onclick="document.getElementById('archivoResp').click()"><span class="em">📂</span><span class="txt">Recuperar un respaldo<small>suma lo que falta, no borra nada</small></span></button>
    <input type="file" id="archivoResp" class="oculto" accept=".txt,.json,text/plain,application/json" onchange="leerRespaldo(this)">

    ${nPrecios?`<button class="btn plano" onclick="volverPreciosCarta()">↩️ Volver a los precios de la carta</button>`:''}
    <div class="rot">Muestra y espacio</div>
    ${hayDemo()?`<button class="btn chico" onclick="accionTraerDemo()"><span class="em">↪️</span><span class="txt">Traer lo que anotaste en la demo</span></button>`:''}
    <button class="btn plano" onclick="cargarEjemplo()">🧪 Cargar ejemplo (pedidos y ventas de mentira)</button>

    <div class="nota">${NEGOCIO.nombre}${c.quien?(' · '+esc(c.quien)):''}<br>

const PANTALLAS={ inicio:pantallaInicio, monto:pantallaMonto, concepto:pantallaConcepto, detalle:pantallaDetalle,
  carta:pantallaCarta, pastel:pantallaPastel, carrito:pantallaCarrito, medio:pantallaMedio, listo:pantallaListo,
  movimientos:pantallaMovimientos, histMov:pantallaHistMov, dia:pantallaDia, cerrar:pantallaCerrar, cerrado:pantallaCerrado,
  pin:pantallaPin, config:pantallaConfig,
  pedido:pantallaPedido, guardado:pantallaGuardado, pedidos:pantallaPedidos, mes:pantallaMes, ficha:pantallaFicha };
function pintar(){
  const el=app(); if(!el) return;
  el.innerHTML=(PANTALLAS[ruta]||pantallaInicio)();
  if(ruta==='pedido') hablarPregunta();
}
let iniciado=false;
function iniciar(){
  pintar();
  if(iniciado) return; iniciado=true;
  try{ if(typeof speechSynthesis!=='undefined'){ VOZ=elegirVoz(); speechSynthesis.onvoiceschanged=()=>{ VOZ=elegirVoz(); }; } }catch(e){}
  try{ if(typeof location!=='undefined' && /^https?:$/.test(location.protocol) && typeof navigator!=='undefined' && 'serviceWorker' in navigator)
    navigator.serviceWorker.register('./sw.js').catch(()=>{}); }catch(e){}
  traerDeLaNube().then(()=>{ if(ruta!=='pedido') pintar(); }).catch(()=>{});
}
(function arrancar(){
  try{ document.title=NEGOCIO.corto; }catch(e){}
  CARTA=cartaGuardada()||CARTA_INCLUIDA;
  if(!config().inicioISO) guardarConfig({ inicioISO:new Date().toISOString() });
  CONV=leerBorrador();
  if(!leerG('entro', null)){ ruta='pin'; temp={ pin:'', crear:!pinGuardado() }; pintar(); }
  else if(debePedirClave()){ ruta='pin'; temp={ pin:'', crear:false }; pintar(); }
  else iniciar();
  cargarCarta();
})();
